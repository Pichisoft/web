<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>PichonCalendar</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: white;

            background-color: #111;
            background-image: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=80');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            min-height: 100vh;
        }

        .brand {
            font-family: "Times New Roman", Times, serif;
            font-size: 2em;
            margin: 0;
        }

        .brand-sub {
            font-family: Arial, sans-serif;
            font-style: italic;
            font-weight: normal;
            font-size: 0.55em;
            opacity: 0.8;
            margin-left: 8px;
            white-space: nowrap;
        }

        .overlay {
            background: rgba(0, 0, 0, 0.2);
            min-height: 100vh;
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: 200px;
            background: rgba(0, 0, 0, 0.85);
            padding: 4px 20px 20px 20px;
        }

        .tab {
            padding: 10px;
            background: black;
            margin-bottom: 5px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .tab:hover,
        .tab.active {
            background: #222;
            border-left: 3px solid #007BFF;
        }

        /* Main */
        .main {
            flex: 1;
            padding: 100px 20px 20px 20px;
        }

        .main h2,
        .main h3 {
            margin-top: 0;
        }

        h1 {
            margin-top: 0;
        }

        .grid {
            display: grid;
            gap: 10px;
        }

        .years {
            grid-template-columns: repeat(4, 1fr);
        }

        .months {
            grid-template-columns: repeat(3, 1fr);
        }

        .days {
            grid-template-columns: repeat(7, 1fr);
        }

        .item {
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            text-align: center;
            cursor: pointer;
            border-radius: 6px;
            border: 1px solid transparent;
            transition: 0.2s;
            position: relative;
        }

        .item:hover {
            background: rgba(50, 50, 50, 0.9);
            border-color: #555;
        }

        /* Indicador de que el día tiene un evento */
        .item.has-event::after {
            content: "";
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 6px;
            background: #007BFF;
            border-radius: 50%;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            margin-bottom: 10px;
            text-align: center;
            font-weight: bold;
            color: #ccc;
        }

        .today {
            background: #007BFF;
            border-color: #0056b3;
        }

        .event {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .event-text {
            margin-top: 10px;
            display: none;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            white-space: pre-wrap;
        }

        input,
        textarea,
        button {
            width: 100%;
            margin-top: 8px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 1px solid #555;
            padding: 10px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
        }

        input[type="date"] {
            color-scheme: dark;
        }

        button {
            background: #333;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        button:hover {
            background: #555;
        }

        .btn-primary {
            background: #007BFF;
            border-color: #0056b3;
        }

        .btn-primary:hover {
            background: #0056b3;
        }

        .btn-danger {
            background: #dc3545;
            border-color: #bd2130;
        }

        .btn-danger:hover {
            background: #bd2130;
        }

        .month-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .month-nav button {
            width: auto;
            margin: 0;
            padding: 8px 16px;
        }

        .month-nav h2 {
            margin: 0;
        }

        /* ===================== FONDOS ===================== */
        .bgSwatch {
            height: 50px;
            border-radius: 4px;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .bgSwatch:hover {
            border: 2px solid white;
        }

        .bgGrid {
            grid-template-columns: repeat(5, 1fr);
        }

        /* ===================== RESPONSIVE ===================== */
        @media (max-width: 900px) {
            .years {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .overlay {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                padding: 96px 12px 12px 12px;
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 8px;
            }

            .sidebar h2.brand {
                width: 100%;
                margin: 0 0 6px 0;
                font-size: 1.5em;
            }

            .tab {
                flex: 1 1 auto;
                margin-bottom: 0;
                text-align: center;
                font-size: 0.85em;
            }

            .main {
                padding: 14px;
            }

            h1.brand {
                font-size: 1.6em;
            }

            .years,
            .months {
                grid-template-columns: repeat(3, 1fr);
            }

            .item {
                padding: 8px;
                font-size: 0.9em;
            }
        }

        @media (max-width: 480px) {
            .sidebar h2 {
                text-align: center;
            }

            .brand-sub {
                display: block;
                margin-left: 0;
                margin-top: 2px;
            }

            .tab {
                flex: 1 1 40%;
            }

            .years,
            .months {
                grid-template-columns: repeat(2, 1fr);
            }

            .bgGrid {
                grid-template-columns: repeat(3, 1fr);
            }

            .days {
                gap: 5px;
            }

            .item {
                padding: 8px 4px;
                font-size: 0.85em;
            }

            .weekdays {
                font-size: 0.75em;
            }

            input,
            textarea,
            button {
                font-size: 16px;
            }
        }

        /* ==========================================
           PICHISOFT - ESTADO DE SESIÓN
           ========================================== */
        #pichisoft-session-status {
            position: fixed;
            top: 12px;
            right: 120px;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: calc(100vw - 20px);
            width: auto;
            box-sizing: border-box;
            padding: 8px 16px;
            background: #000;
            color: #20a84b;
            border: 1px solid rgba(34, 197, 94, 0.25);
            border-radius: 22px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
            font: 14px/1.3 Georgia, serif;
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.6s ease, transform 0.6s ease;
            pointer-events: none;
        }

        #pichisoft-session-status.hidden {
            opacity: 0;
            transform: translateY(-12px);
        }

        #pichisoft-session-status.success {
            font-weight: bold;
        }

        #pichisoft-session-status .ps-check {
            display: none;
            font-size: 20px;
            font-weight: bold;
            line-height: 1;
        }

        #pichisoft-session-status.success .ps-check {
            display: inline-block;
            animation: pichisoftCheck 0.8s cubic-bezier(.17, .89, .32, 1.49) forwards;
        }

        @keyframes pichisoftCheck {
            0% {
                opacity: 0;
                transform: scale(0.2) rotate(-25deg);
            }

            60% {
                opacity: 1;
                transform: scale(1.25) rotate(8deg);
            }

            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        #pichisoft-session-profile {
            position: fixed;
            top: 12px;
            right: 140px;
            z-index: 9998;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: calc(100vw - 20px);
            box-sizing: border-box;
            padding: 5px 14px 5px 5px;
            background: #000;
            color: #fff;
            border: 1px solid rgba(34, 197, 94, 0.25);
            border-radius: 25px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
            font-family: Georgia, serif;
            opacity: 0;
            transform: translateY(-12px) scale(0.9);
            transition: opacity 0.7s ease, transform 0.7s cubic-bezier(.17, .89, .32, 1.3);
            pointer-events: none;
        }

        #pichisoft-session-profile.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        #pichisoft-profile-picture img,
        #pichisoft-profile-picture .profile-placeholder {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #pichisoft-profile-picture .profile-placeholder {
            background: #20a84b;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
        }

        #pichisoft-profile-name {
            font-size: 14px;
            font-weight: bold;
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        @media (max-width: 600px) {

            #pichisoft-session-status,
            #pichisoft-session-profile {
                right: 10px;
                top: 56px;
                position: absolute;
                left: auto;
                max-width: calc(100vw - 20px);
            }

            #pichisoft-session-status {
                font-size: 13px;
                padding: 7px 14px;
            }
        }

        /* ==========================================
           TOASTS & MODAL
           ========================================== */
        .toast-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 99999;
            pointer-events: none;
            width: min(420px, calc(100vw - 30px));
        }

        .toast {
            padding: 13px 18px;
            border-radius: 9px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translateY(16px);
            transition: 0.3s;
            pointer-events: auto;
            cursor: pointer;
            border: 1px solid transparent;
            line-height: 1.35;
        }

        .toast.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.error {
            background: #8e3030;
            color: #fff;
            border-color: #642020;
        }

        .toast.success {
            background: #20a84b;
            color: #fff;
            border-color: #167a36;
        }

        .toast.info {
            background: #1b1b27;
            color: #fff;
            border-color: #ffffff33;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 20000;
            padding: 20px;
        }

        .modal-overlay.on {
            display: flex;
        }

        .modal-box {
            background: #1b1b27;
            border: 1px solid #ffffff33;
            border-radius: 16px;
            padding: 20px;
            width: min(400px, 100%);
        }

        .modal-box h3 {
            margin-top: 0;
            font-family: "Times New Roman", serif;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-actions button {
            width: auto;
            margin: 0;
            padding: 8px 16px;
        }
    </style>
</head>

<body>

    <div class="overlay">

        <div class="sidebar">
            <h2 class="brand">PichonCalendar<span class="brand-sub"> - By Pichisoft -</span></h2>
            <div class="tab" onclick="showYears()">Años</div>
            <div class="tab" onclick="showMonths()">Meses</div>
            <div class="tab" onclick="showDays()">Días</div>
            <div class="tab" onclick="showEvents()">Eventos</div>
            <div class="tab" onclick="showBackground()">Fondo</div>
        </div>

        <div class="main">
            <div id="app"></div>
        </div>

    </div>

    <!-- Contenedor de Toasts -->
    <div id="toastContainer" class="toast-container" aria-live="polite"></div>

    <!-- Modal para Confirmar -->
    <div id="confirmModal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modalTitle">Confirmar</h3>
            <p id="modalText">¿Estás seguro?</p>
            <div class="modal-actions">
                <button onclick="closeModal()">Cancelar</button>
                <button class="btn-danger" id="modalBtnOk">Aceptar</button>
            </div>
        </div>
    </div>

    <script>
        const app = document.getElementById("app");

        /* ===== UTILIDADES ===== */
        function getLocalDate() { return new Date(); }
        let today = getLocalDate();
        let baseYear = today.getFullYear();
        let currentYear = baseYear;
        let currentMonth = today.getMonth();
        let currentDay = today.getDate();

        const months = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
        const weekdays = ["lun", "mar", "mié", "jue", "vie", "sáb", "dom"];

        function getEvents() { return JSON.parse(localStorage.getItem("events") || "{}"); }
        function saveEvents(e) { localStorage.setItem("events", JSON.stringify(e)); }
        function pad(n) { return n.toString().padStart(2, "0"); }

        function formatKeyAsDate(key) {
            const [y, m, d] = key.split("-").map(Number);
            return `${pad(d)}/${pad(m + 1)}/${y}`;
        }

        function dateToKey(d, m, y) {
            return `${y}-${m}-${d}`;
        }

        function escapeHtml(str) {
            const div = document.createElement("div");
            div.innerText = str || "";
            return div.innerHTML;
        }

        /* Toasts y Modal */
        function showToast(message, type = "info", duration = 3000) {
            const container = document.getElementById("toastContainer");
            const toast = document.createElement("div");
            toast.className = "toast " + type;
            toast.textContent = message;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add("visible"));
            const close = () => {
                toast.classList.remove("visible");
                setTimeout(() => toast.remove(), 300);
            };
            setTimeout(close, duration);
            toast.addEventListener("click", close);
        }

        function confirmAction(title, text, onOk) {
            document.getElementById("modalTitle").textContent = title;
            document.getElementById("modalText").textContent = text;
            const btnOk = document.getElementById("modalBtnOk");
            const newBtn = btnOk.cloneNode(true);
            btnOk.parentNode.replaceChild(newBtn, btnOk);

            newBtn.onclick = () => {
                onOk();
                closeModal();
            };
            document.getElementById("confirmModal").classList.add("on");
        }

        function closeModal() {
            document.getElementById("confirmModal").classList.remove("on");
        }

        /* ===================== VISTAS ===================== */

        function showYears() {
            baseYear = getLocalDate().getFullYear();
            // Aseguramos que el año actual esté en el rango visible (bloque de 10 años)
            if (currentYear < baseYear - 5 || currentYear > baseYear + 5) {
                baseYear = currentYear;
            } else {
                baseYear = getLocalDate().getFullYear();
            }

            let html = "<h2>Elegir año</h2><div class='grid years'>";
            for (let y = baseYear - 5; y <= baseYear + 5; y++) {
                const isCurrent = y === currentYear ? " style='border-color: #007BFF;'" : "";
                html += `<div class="item"${isCurrent} onclick="currentYear=${y}; showMonths()">${y}</div>`;
            }
            html += "</div>";
            app.innerHTML = html;
        }

        function showMonths() {
            // Si currentYear está fuera de rango (por un evento de año 333), lo forzamos al actual
            if (currentYear < 1900 || currentYear > 2100) {
                currentYear = getLocalDate().getFullYear();
                showToast("Año inválido, redirigiendo al actual.", "info");
            }

            let html = `<div class="month-nav"><button onclick="currentYear--; showMonths()">&#10094;</button><h2>${currentYear}</h2><button onclick="currentYear++; showMonths()">&#10095;</button></div><div class="grid months">`;
            months.forEach((m, i) => {
                html += `<div class="item" onclick="showDays(${currentYear}, ${i})">${m}</div>`;
            });
            html += "</div>";
            app.innerHTML = html;
        }

        function daysInMonth(y, m) {
            return new Date(y, m + 1, 0).getDate();
        }

        function firstDay(y, m) {
            let d = new Date(y, m, 1).getDay();
            return d === 0 ? 6 : d - 1;
        }

        function showDays(year = currentYear, month = currentMonth) {
            // ESCUDO DE SEGURIDAD: Evita que un año de 333 rompa todo el calendario
            if (year < 1900 || year > 2100) {
                year = getLocalDate().getFullYear();
                month = getLocalDate().getMonth();
                showToast("El año estaba fuera de rango, se reinició al actual.", "info");
            }

            currentYear = year;
            currentMonth = month;

            let total = daysInMonth(year, month);
            let start = firstDay(year, month);
            let today = getLocalDate();
            let events = getEvents();

            let html = `<div class="month-nav">
                <button onclick="navigateMonth(-1)">&#10094;</button>
                <h2>${months[month]} ${year}</h2>
                <button onclick="navigateMonth(1)">&#10095;</button>
            </div>`;

            html += `<div class="weekdays">${weekdays.map(d => `<div>${d}</div>`).join("")}</div>`;
            html += `<div class="grid days">`;

            for (let i = 0; i < start; i++) {
                html += "<div></div>";
            }

            for (let d = 1; d <= total; d++) {
                let isToday = d === today.getDate() && month === today.getMonth() && year === today.getFullYear();
                let key = dateToKey(d, month, year);
                let hasEvent = events[key] ? " has-event" : "";

                html += `<div class="item ${isToday ? 'today' : ''}${hasEvent}" onclick="openDay(${d})">${d}</div>`;
            }

            html += "</div>";
            app.innerHTML = html;
        }

        function navigateMonth(dir) {
            let newMonth = currentMonth + dir;
            let newYear = currentYear;
            if (newMonth > 11) { newMonth = 0; newYear++; }
            else if (newMonth < 0) { newMonth = 11; newYear--; }
            showDays(newYear, newMonth);
        }

        function openDay(day) {
            currentDay = day;
            const events = getEvents();
            const key = dateToKey(currentYear, currentMonth, day);
            const ev = events[key] || { title: "", text: "" };
            const hasEvent = !!events[key];

            app.innerHTML = `
                <h2>${day} de ${months[currentMonth]} de ${currentYear}</h2>
                <input id="title" placeholder="Nombre del evento" value="${escapeHtml(ev.title)}">
                <textarea id="text" placeholder="Descripción (opcional)" style="min-height:100px">${escapeHtml(ev.text)}</textarea>
                
                <div style="display:flex; gap:10px; margin-top:10px;">
                    <button class="btn-primary" onclick="saveEvent()">Guardar evento</button>
                    ${hasEvent ? '<button class="btn-danger" onclick="deleteEventByKey(\'' + key + '\')">Borrar evento</button>' : ''}
                </div>
            `;
        }

        function saveEvent() {
            const title = document.getElementById("title").value.trim();
            const text = document.getElementById("text").value.trim();

            if (!title) {
                showToast("Ingresá un nombre para el evento.", "error");
                return;
            }

            const events = getEvents();
            const key = dateToKey(currentYear, currentMonth, currentDay);
            events[key] = { title, text };
            saveEvents(events);

            showToast("Evento guardado correctamente.", "success");
            showDays(currentYear, currentMonth);
        }

        /* ===================== VISTA DE EVENTOS ===================== */

        function showEvents() {
            const events = getEvents();
            let html = `
                <h2>Mis Eventos</h2>
                <h3>Agregar nuevo evento</h3>
                <input id="evTitle" placeholder="Nombre del evento">
                <input type="date" id="evDate" min="1900-01-01" max="2100-12-31">
                <textarea id="evText" placeholder="Descripción (opcional)"></textarea>
                <button class="btn-primary" onclick="addEvent()">Agregar Evento</button>
                <hr style="margin: 30px 0; border-color: #333;">
                <h3>Lista de eventos</h3>
            `;

            const sortedKeys = Object.keys(events).sort((a, b) => {
                const [ay, am, ad] = a.split("-").map(Number);
                const [by, bm, bd] = b.split("-").map(Number);
                return new Date(ay, am, ad) - new Date(by, bm, bd);
            });

            if (sortedKeys.length === 0) {
                html += "<p style='color:#aaa'>No hay eventos guardados.</p>";
            }

            let i = 0;
            for (const key of sortedKeys) {
                const ev = events[key];
                const id = "ev" + i;
                html += `
                    <div class="event">
                        <b style="font-size:1.1em;">${escapeHtml(ev.title)}</b><br>
                        <span style="color:#007BFF; font-size:0.9em;">${formatKeyAsDate(key)}</span>
                        
                        <div style="display:flex; gap:5px; margin-top:10px; flex-wrap:wrap;">
                            <button onclick="toggleEvent('${id}')" style="flex:1;">Ver/Ocultar</button>
                            <button onclick="editEvent('${key}')" style="flex:1;">Editar</button>
                            <button class="btn-danger" onclick="deleteEventByKey('${key}')" style="flex:1;">Eliminar</button>
                        </div>

                        <div id="${id}" class="event-text">${escapeHtml(ev.text) || "Sin descripción."}</div>
                    </div>
                `;
                i++;
            }
            app.innerHTML = html;
        }

        function toggleEvent(id) {
            const el = document.getElementById(id);
            el.style.display = el.style.display === "block" ? "none" : "block";
        }

        /* 🛡️ VALIDACIÓN ESTRICTA (1900 - 2100) */
        function isValidDate(d, m, y) {
            if (![d, m, y].every(Number.isInteger)) return false;
            if (m < 1 || m > 12) return false;

            // Evitar años irreales (como el 333 o el 9999)
            if (y < 1900 || y > 2100) return false;

            const maxDay = daysInMonth(y, m - 1);
            return d >= 1 && d <= maxDay;
        }

        function addEvent() {
            const title = document.getElementById("evTitle").value.trim();
            const dateStr = document.getElementById("evDate").value;
            const text = document.getElementById("evText").value.trim();

            if (!title) { showToast("Ingresá un nombre para el evento.", "error"); return; }
            if (!dateStr) { showToast("Seleccioná una fecha.", "error"); return; }

            const [y, m, d] = dateStr.split("-").map(Number);

            if (!isValidDate(d, m, y)) {
                showToast("Fecha inválida. El año debe estar entre 1900 y 2100.", "error", 4000);
                return;
            }

            const key = dateToKey(d, m - 1, y);
            const events = getEvents();

            if (events[key]) {

                events[key] = { title, text };
                saveEvents(events);
                showToast("Evento agregado.", "success");
                showEvents();
            }
        }

        function editEvent(key) {
            const events = getEvents();
            const ev = events[key];
            const [y, m, d] = key.split("-").map(Number);

            currentYear = y;
            currentMonth = m;
            currentDay = d;

            const dateInputValue = `${y}-${pad(m + 1)}-${pad(d)}`;

            app.innerHTML = `
                <h2>Editar evento</h2>
                <input id="title" value="${escapeHtml(ev.title)}">
                <input type="date" id="editDate" value="${dateInputValue}" min="1900-01-01" max="2100-12-31">
                <textarea id="text" style="min-height:100px">${escapeHtml(ev.text)}</textarea>
                <div style="display:flex; gap:10px; margin-top:10px;">
                    <button class="btn-primary" onclick="saveEditedEvent('${key}')">Guardar cambios</button>
                    <button onclick="showEvents()">Cancelar</button>
                </div>
            `;
        }

        function saveEditedEvent(oldKey) {
            const title = document.getElementById("title").value.trim();
            const dateStr = document.getElementById("editDate").value;
            const text = document.getElementById("text").value.trim();

            if (!title) { showToast("El nombre es obligatorio.", "error"); return; }
            if (!dateStr) { showToast("La fecha es obligatoria.", "error"); return; }

            const [y, m, d] = dateStr.split("-").map(Number);

            if (!isValidDate(d, m, y)) {
                showToast("Fecha inválida. El año debe estar entre 1900 y 2100.", "error", 4000);
                return;
            }

            const newKey = dateToKey(d, m - 1, y);
            const events = getEvents();

            if (oldKey !== newKey && events[newKey]) {
                confirmAction("Fecha ocupada", "Ya hay un evento en la nueva fecha. ¿Reemplazarlo?", () => {
                    delete events[oldKey];
                    events[newKey] = { title, text };
                    saveEvents(events);
                    showToast("Evento actualizado.", "success");
                    showEvents();
                });
            } else {
                delete events[oldKey];
                events[newKey] = { title, text };
                saveEvents(events);
                showToast("Evento actualizado.", "success");
                showEvents();
            }
        }

        function deleteEventByKey(key) {
            confirmAction("Borrar evento", "¿Seguro que querés borrar este evento?", () => {
                const events = getEvents();
                delete events[key];
                saveEvents(events);
                showToast("Evento borrado.", "info");
                showEvents();
            });
        }

        /* ===================== FONDO DE PANTALLA ===================== */

        const DEFAULT_BG_IMAGE = "url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=80')";
        const bgColors = [
            "#000000", "#111111", "#1e1e1e", "#0f172a", "#1e293b",
            "#312e81", "#7c3aed", "#2563eb", "#0891b2", "#16a34a",
            "#65a30d", "#ca8a04", "#f59e0b", "#ea580c", "#dc2626",
            "#be123c", "#ffffff"
        ];

        function showBackground() {
            let html = `<h2>Fondo de pantalla</h2><p>Elegí un color sólido o quitá el fondo.</p><div class="grid bgGrid">`;
            bgColors.forEach(c => {
                html += `<div class="bgSwatch" style="background:${c};" title="${c}" onclick="setSolidBackground('${c}')"></div>`;
            });
            html += `</div>
                <button onclick="setDefaultBackground()" style="margin-top:15px;">Fondo predeterminado</button>
                <button onclick="removeBackground()" style="margin-top:10px;">Quitar fondo</button>`;
            app.innerHTML = html;
        }

        function setDefaultBackground() {
            document.body.style.backgroundImage = DEFAULT_BG_IMAGE;
            document.body.style.backgroundColor = "#111";
            localStorage.setItem("bgType", "default");
            localStorage.removeItem("bgColor");
            showToast("Fondo restablecido.", "success");
        }

        function setSolidBackground(color) {
            document.body.style.backgroundImage = "none";
            document.body.style.backgroundColor = color;
            localStorage.setItem("bgType", "color");
            localStorage.setItem("bgColor", color);
            showToast("Color de fondo aplicado.", "success");
        }

        function removeBackground() {
            document.body.style.backgroundImage = "none";
            document.body.style.backgroundColor = "#111";
            localStorage.setItem("bgType", "none");
            localStorage.removeItem("bgColor");
            showToast("Fondo quitado.", "info");
        }

        function applySavedBackground() {
            const type = localStorage.getItem("bgType");
            if (type === "color") {
                const color = localStorage.getItem("bgColor") || "#111";
                document.body.style.backgroundImage = "none";
                document.body.style.backgroundColor = color;
            } else if (type === "none") {
                document.body.style.backgroundImage = "none";
                document.body.style.backgroundColor = "#111";
            } else if (type === "default") {
                document.body.style.backgroundImage = DEFAULT_BG_IMAGE;
                document.body.style.backgroundColor = "#111";
            }
        }

        /* ===================== INICIO ===================== */
        applySavedBackground();
        showDays(currentYear, currentMonth);
