<!doctype html> 
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PichonApps</title>

    <style>
        html {
            background-color: #222;
            color: whitesmoke;
            font-family: Verdana, "Open Sans", "Helvetica Neue", sans-serif;
            font-size: 18px;
        }

        a,
        a:visited {
            color: whitesmoke;
            text-decoration: none;
            padding: 4px;
        }

        a:hover {
            /* font-style: italic; */
            background-color: whitesmoke;
            color: #222;
        }

        li {
            /* padding: 10px; */
            margin-bottom: 10px;
        }

        .titulo {
            font-family: "Times New Roman", Times, serif;
        }

        .by {
            font-family: Verdana, "Open Sans", "Helvetica Neue", sans-serif;
            font-size: 18px;
            font-weight: normal;
            font-style: italic;
            color: #bbb;
        }

      .nuevo::after {
            content: "NUEVO";
            background-color: rgb(167, 28, 28);
            padding: 4px;
            font-size: 0.7em;
            border-radius: 6px;
        }
         .actualizado::after {
            content: "ACTUALIZADO";
            background-color: rgb(44, 167, 28);
            padding: 4px;
            font-size: 0.7em;
            border-radius: 6px;
        }
.eliminadas::after {
  content: "ÚLTIMOS 10 DÍAS";
  background-color: rgb(167, 165, 28);
  padding: 4px;
  font-size: 0.7em;
  border-radius: 6px;
}

.proximo::after {
  content: "PRÓXIMAMENTE";
  background-color: rgb(28, 65, 167);
  padding: 4px;
  font-size: 0.7em;
  border-radius: 6px;
}

.etiqueta {
  padding: 4px;
  font-size: 0.7em;
  border-radius: 6px;
  margin-left: 6px;
}

.et-nuevo {
  background-color: rgb(167, 28, 28);
}

.et-actualizado {
  background-color: rgb(44, 167, 28);
}

/* .et-nuevo ya está arriba, no lo repitas */

.et-beta {
  background-color: rgb(193, 35, 207); /* <- pon aquí el rgb de tu color para BETA */
}

.et-cancelado {
  background-color: rgb(92, 15, 15); /* <- pon aquí el rgb de tu color para CANCELADO */
}

.et-ultimos {
  background-color: rgb(167, 165, 28); /* el mismo amarillo de "eliminadas" */
}

.et-act-cancelada {
  background-color: rgb(92, 15, 15); /* <- pon aquí el rgb de tu color para ACTUALIZACIÓN CANCELADA */
}

/* .et-ultimos ya está del bloque anterior, no lo repitas */

.et-mantenimiento {
  background-color: rgb(20, 187, 216); /* <- pon aquí el rgb de tu color celeste para MANTENIMIENTO */
}
        


    </style>
     <link rel="manifest" href="manifest.json">
</head>

</li>
