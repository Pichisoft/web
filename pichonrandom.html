<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>PichonRandom</title>

    <style>
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --text: #f2f2f2;
            --accent: #2d6cdf;
            --border: #333;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            width: 100%;
            min-height: 100%;
            font-family: Arial, sans-serif;
        }

        header {
            position: sticky;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            background: var(--bg);
            padding: 14px 16px calc(10px + env(safe-area-inset-top, 0px));
            padding-top: calc(14px + env(safe-area-inset-top, 0px));
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 8px;
        }

        .brand {
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
        }

        .brand-title {
            font-family: "Times New Roman", Times, serif;
            font-weight: bold;
            color: #fff;
            font-size: clamp(20px, 4vw, 32px);
        }

        .brand-sub {
            font-style: italic;
            color: #999;
            font-size: clamp(11px, 2vw, 14px);
            font-family: Arial, sans-serif;
        }

        .pichisoft-link {
            font-family: "Times New Roman", Times, serif;
            color: var(--accent);
            text-decoration: underline;
            font-weight: bold;
            font-size: clamp(14px, 2.5vw, 18px);
            cursor: pointer;
            background: none;
            border: none;
        }

        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 52px 16px 60px;
            min-height: calc(100vh - 100px);
        }

        .subtitle {
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: clamp(20px, 4vw, 30px);
            text-align: center;
            margin: 10px 0 30px;
        }

        .menu {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        .menu-item {
            flex: 1 1 180px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px 12px;
            text-align: center;
            cursor: pointer;
            transition: transform .15s, background .15s;
        }

        .menu-item:hover {
            background: #262626;
            transform: translateY(-3px);
        }

        .menu-item h3 {
            font-family: "Times New Roman", Times, serif;
            font-weight: bold;
            font-size: clamp(18px, 3vw, 24px);
            margin: 0;
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
        }

        .back-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .back-btn:hover {
            background: #262626;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .field input[type="text"],
        .field input[type="number"],
        .field select {
            width: 100%;
            max-width: 320px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #0f0f0f;
            color: var(--text);
            font-size: 16px;
        }

        .radio-group {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .radio-group label {
            font-weight: normal;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .generate-btn {
            display: block;
            margin: 26px auto 0;
            font-family: "Times New Roman", Times, serif;
            font-weight: bold;
            font-size: clamp(18px, 3vw, 24px);
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 14px 36px;
            border-radius: 10px;
            cursor: pointer;
            transition: background .2s;
        }

        .generate-btn:hover {
            background: #2358b8;
        }

        .results {
            margin-top: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        .result-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 20px;
            font-size: clamp(18px, 3vw, 26px);
            font-weight: bold;
            min-width: 60px;
            text-align: center;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Dado */
        .dice-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            margin-top: 20px;
        }

        .dice {
            width: min(40vw, 150px);
            height: min(40vw, 150px);
            background: #fff;
            border-radius: 18px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            padding: 14px;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .4);
            transform-style: preserve-3d;
        }

        .dice.rolling {
            animation: roll .6s ease-in-out;
        }

        @keyframes roll {
            0% {
                transform: rotate(0deg) scale(1);
            }

            20% {
                transform: rotate(-25deg) scale(1.05);
            }

            40% {
                transform: rotate(20deg) scale(1.1);
            }

            60% {
                transform: rotate(-15deg) scale(1.08);
            }

            80% {
                transform: rotate(10deg) scale(1.03);
            }

            100% {
                transform: rotate(0deg) scale(1);
            }
        }

        .dot {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dot::after {
            content: "";
            width: 60%;
            height: 60%;
            background: #111;
            border-radius: 50%;
            display: none;
            transition: transform .15s;
        }

        .dot.on::after {
            display: block;
        }

        .generate-btn.dado-btn {
            margin-top: 0;
        }

        @media (max-width:480px) {
            .menu {
                flex-direction: column;
            }

            header {
                padding-left: 12px;
                padding-right: 12px;
            }
        }

        /* ==========================================
           PICHISOFT - ESTADO DE SESIÓN
           ========================================== */

        #pichisoft-session-status {
            position: fixed;
            top: 12px;
            right: 120px;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: calc(100vw - 20px);
            box-sizing: border-box;
            padding: 8px 16px;
            background: #000;
            color: #20a84b;
            border: 1px solid rgba(34, 197, 94, 0.25);
            border-radius: 22px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
            font: 14px/1.3 Georgia, serif;
            text-align: left;
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.6s ease, transform 0.6s ease;
            pointer-events: none;
        }

        #pichisoft-session-status.hidden {
            opacity: 0;
            transform: translateY(-12px);
        }

        #pichisoft-session-status.success {
            font-weight: bold;
        }

        #pichisoft-session-status .ps-check {
            display: none;
            font-size: 20px;
            font-weight: bold;
            line-height: 1;
        }

        #pichisoft-session-status.success .ps-check {
            display: inline-block;
            animation: pichisoftCheck 0.8s cubic-bezier(.17, .89, .32, 1.49) forwards;
        }

        @keyframes pichisoftCheck {
            0% {
                opacity: 0;
                transform: scale(0.2) rotate(-25deg);
            }

            60% {
                opacity: 1;
                transform: scale(1.25) rotate(8deg);
            }

            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        #pichisoft-session-profile {
            position: fixed;
            top: 12px;
            right: 120px;
            z-index: 9998;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: calc(100vw - 20px);
            box-sizing: border-box;
            padding: 5px 14px 5px 5px;
            background: #000;
            color: #fff;
            border: 1px solid rgba(34, 197, 94, 0.25);
            border-radius: 25px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
            font-family: Georgia, serif;
            text-align: left;
            opacity: 0;
            transform: translateY(-12px) scale(0.9);
            transition: opacity 0.7s ease, transform 0.7s cubic-bezier(.17, .89, .32, 1.3);
            pointer-events: none;
        }

        #pichisoft-session-profile.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        #pichisoft-profile-picture img,
        #pichisoft-profile-picture .profile-placeholder {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #pichisoft-profile-picture .profile-placeholder {
            background: #20a84b;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
        }

        #pichisoft-profile-name {
            font-size: 14px;
            font-weight: bold;
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Ajustes en Celular */
        @media (max-width: 600px) {

            #pichisoft-session-status,
            #pichisoft-session-profile {
                position: fixed;
                top: 60px;
                /* Justo debajo del header */
                right: 10px;
                left: auto;
                max-width: calc(100vw - 20px);
            }

            #pichisoft-session-status {
                font-size: 13px;
                padding: 7px 14px;
            }

            main {
                padding-top: 80px;
                /* Despeja el cartel de sesión */
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="brand">
            <span class="brand-title">PichonRandom</span>
            <span class="brand-sub">- By Pichisoft -</span>
        </div>
        <button class="pichisoft-link" onclick="window.open('https://pichisoft.cc','_blank')">Pichisoft</button>
    </header>

    <main>
        <!-- MENU -->
        <div id="view-menu" class="view active">
            <div class="subtitle">Elegí un modo</div>
            <div class="menu">
                <div class="menu-item" onclick="showView('numero')">
                    <h3>Número aleatorio</h3>
                </div>
                <div class="menu-item" onclick="showView('dado')">
                    <h3>Dado</h3>
                </div>
                <div class="menu-item" onclick="showView('letra')">
                    <h3>Letra</h3>
                </div>
            </div>
        </div>

        <!-- NUMERO -->
        <div id="view-numero" class="view">
            <button class="back-btn" onclick="showView('menu')">&larr; Volver</button>
            <div class="subtitle">Número aleatorio</div>
            <div class="field">
                <label for="cifras">Cantidad de cifras (máx 8):</label>
                <input type="number" id="cifras" inputmode="numeric" placeholder="Ej: 3" value="1" min="1" max="8"
                    oninput="validarCifras()">
            </div>
            <div class="field">
                <label for="cantidad">Cantidad de números aleatorios (máx 15):</label>
                <input type="number" id="cantidad" min="1" max="15" value="1" oninput="validarCantidad()">
                <div id="error-cantidad" style="color:#ff4d4d;font-size:14px;margin-top:6px;display:none;">
                    No puede elegir más de 15 números aleatorios
                </div>
            </div>
            <div class="field">
                <label>Tipo de número:</label>
                <div class="radio-group">
                    <label><input type="radio" name="tipoNum" value="par"> Par</label>
                    <label><input type="radio" name="tipoNum" value="impar"> Impar</label>
                    <label><input type="radio" name="tipoNum" value="ambos" checked> Ambos</label>
                </div>
            </div>
            <button class="generate-btn" onclick="generarNumeros()">Generar</button>
            <div class="results" id="resultados-numero"></div>
        </div>

        <!-- DADO -->
        <div id="view-dado" class="view">
            <button class="back-btn" onclick="showView('menu')">&larr; Volver</button>
            <div class="subtitle">Dado</div>
            <div class="dice-wrap">
                <div class="dice" id="dado">
                    <div class="dot" id="d1"></div>
                    <div class="dot" id="d2"></div>
                    <div class="dot" id="d3"></div>
                    <div class="dot" id="d4"></div>
                    <div class="dot on" id="d5"></div>
                    <div class="dot" id="d6"></div>
                    <div class="dot" id="d7"></div>
                    <div class="dot" id="d8"></div>
                    <div class="dot" id="d9"></div>
                </div>
                <button class="generate-btn dado-btn" onclick="tirarDado()">Tirar</button>
            </div>
        </div>

        <!-- LETRA -->
        <div id="view-letra" class="view">
            <button class="back-btn" onclick="showView('menu')">&larr; Volver</button>
            <div class="subtitle">Letra</div>
            <div class="field">
                <label>Tipo de letra:</label>
                <div class="radio-group">
                    <label><input type="radio" name="tipoLetra" value="consonante"> Consonante</label>
                    <label><input type="radio" name="tipoLetra" value="vocal"> Vocal</label>
                    <label><input type="radio" name="tipoLetra" value="ambas" checked> Ambas</label>
                </div>
            </div>
            <button class="generate-btn" onclick="generarLetra()">Generar</button>
            <div class="results" id="resultado-letra"></div>
        </div>
    </main>

    <script>
        function showView(name) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('view-' + name).classList.add('active');
        }

        function validarCifras() {
            const input = document.getElementById('cifras');
            let val = parseInt(input.value);
            if (isNaN(val) || val < 1) input.value = 1;
            if (val > 8) input.value = 8; // Límite seguro para JS
        }

        function validarCantidad() {
            const input = document.getElementById('cantidad');
            const error = document.getElementById('error-cantidad');
            const valor = parseInt(input.value);
            if (valor > 15) {
                error.style.display = 'block';
                return false;
            } else {
                error.style.display = 'none';
                return true;
            }
        }

        function generarNumeros() {
            if (!validarCantidad()) return;

            let cifras = parseInt(document.getElementById('cifras').value) || 1;
            cifras = Math.min(Math.max(cifras, 1), 8); // Entre 1 y 8 cifras

            let cantidad = parseInt(document.getElementById('cantidad').value) || 1;
            cantidad = Math.min(Math.max(cantidad, 1), 15);

            const tipo = document.querySelector('input[name="tipoNum"]:checked').value;

            const min = cifras <= 1 ? 0 : Math.pow(10, cifras - 1);
            const max = Math.pow(10, cifras) - 1;

            const cont = document.getElementById('resultados-numero');
            cont.innerHTML = '';

            for (let i = 0; i < cantidad; i++) {
                let num;

                if (tipo === 'ambos') {
                    num = Math.floor(Math.random() * (max - min + 1)) + min;
                } else {
                    // Fórmula directa para pares o impares (sin bucles while)
                    let start = min, end = max;

                    if (tipo === 'par') {
                        if (start % 2 !== 0) start++;
                        if (end % 2 !== 0) end--;
                    } else { // impar
                        if (start % 2 === 0) start++;
                        if (end % 2 === 0) end--;
                    }

                    if (start > end) {
                        // No hay números de ese tipo en este rango (ej. 1 cifra, solo el 0 es par)
                        num = "N/A";
                    } else {
                        const count = (end - start) / 2 + 1;
                        const rand = Math.floor(Math.random() * count);
                        num = start + rand * 2;
                    }
                }

                const box = document.createElement('div');
                box.className = 'result-box';
                box.textContent = num;
                cont.appendChild(box);
            }
        }

        const caras = {
            1: [5],
            2: [1, 9],
            3: [1, 5, 9],
            4: [1, 3, 7, 9],
            5: [1, 3, 5, 7, 9],
            6: [1, 3, 4, 6, 7, 9]
        };
        let rolling = false;

        function pintarCara(valor) {
            for (let i = 1; i <= 9; i++) {
                document.getElementById('d' + i).classList.remove('on');
            }
            caras[valor].forEach(n => document.getElementById('d' + n).classList.add('on'));
        }

        function tirarDado() {
            if (rolling) return;
            rolling = true;
            const dado = document.getElementById('dado');
            dado.classList.remove('rolling');
            void dado.offsetWidth; // reinicia animación
            dado.classList.add('rolling');

            let vueltas = 0;
            const maxVueltas = 8;
            const interval = setInterval(() => {
                pintarCara(Math.floor(Math.random() * 6) + 1);
                vueltas++;
                if (vueltas >= maxVueltas) {
                    clearInterval(interval);
                    const valorFinal = Math.floor(Math.random() * 6) + 1;
                    pintarCara(valorFinal);
                    rolling = false;
                }
            }, 70);
        }

        function generarLetra() {
            const vocales = ['A', 'E', 'I', 'O', 'U'];
            const consonantes = ['B', 'C', 'D', 'F', 'G', 'H', 'J', 'K', 'L', 'M', 'N', 'Ñ', 'P', 'Q', 'R', 'S', 'T', 'V', 'W', 'X', 'Y', 'Z'];
            const tipo = document.querySelector('input[name="tipoLetra"]:checked').value;
            let pool = [];
            if (tipo === 'vocal') pool = vocales;
            else if (tipo === 'consonante') pool = consonantes;
            else pool = vocales.concat(consonantes);
            const letra = pool[Math.floor(Math.random() * pool.length)];
            document.getElementById('resultado-letra').innerHTML = '<div class="result-box">' + letra + '</div>';
        }
    </script>

    <!-- ===== Pichisoft - Estado de sesión ===== -->
    <div id="pichisoft-session-status" role="status" aria-live="polite">
        <span class="ps-check">✓</span>
        <span class="ps-text">Iniciando sesión en tu cuenta de Pichisoft...</span>
    </div>

    <div id="pichisoft-session-profile">
        <div id="pichisoft-profile-picture"></div>
        <span id="pichisoft-profile-name"></span>
    </div>

    <script>
        (function () {
            var CFG = {
                apiKey: "AIzaSyCf_P8qp9nBUnsVe3qsTAtZJjZHOktKf-8",
                authDomain: "pichisoft.firebaseapp.com",
                projectId: "pichisoft",
                storageBucket: "pichisoft.firebasestorage.app",
                messagingSenderId: "690032082295",
                appId: "1:690032082295:web:b7f0e8cb8fcceb26e9b572",
                measurementId: "G-K7HRKR8BJ1"
            };
            var V = "https://www.gstatic.com/firebasejs/12.3.0/";
            var DUR_INICIO = 12000;
            var DUR_MENSAJE = 6000;

            var box = document.getElementById("pichisoft-session-status");
            var txt = box.querySelector(".ps-text");
            var prof = document.getElementById("pichisoft-session-profile");
            var pic = document.getElementById("pichisoft-profile-picture");
            var nameEl = document.getElementById("pichisoft-profile-name");
            var t0 = Date.now();

            function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

            async function comprobar() {
                try {
                    var m = await Promise.all([
                        import(V + "firebase-app.js"),
                        import(V + "firebase-auth.js"),
                        import(V + "firebase-firestore.js")
                    ]);
                    var app = m[0].initializeApp(CFG);
                    var auth = m[1].getAuth(app);
                    var db = m[2].getFirestore(app);

                    var user = await Promise.race([
                        new Promise(function (res) {
                            m[1].onAuthStateChanged(auth, function (u) {
                                window.PichisoftFirebase = { auth: auth, db: db, currentUser: u };
                                res(u);
                            });
                        }),
                        wait(15000).then(function () { throw new Error("tiempo agotado"); })
                    ]);

                    var perfil = {};
                    if (user) {
                        try {
                            var snap = await m[2].getDoc(m[2].doc(db, "users", user.uid));
                            if (snap.exists()) perfil = snap.data();
                        } catch (e) { }
                    }
                    return { user: user, perfil: perfil };
                } catch (e) {
                    return { error: true };
                }
            }

            async function aviso(texto) {
                txt.textContent = texto;
                await wait(DUR_MENSAJE);
                box.classList.add("hidden");
            }

            (async function () {
                var r = await comprobar();
                await wait(Math.max(0, DUR_INICIO - (Date.now() - t0)));

                if (r.error) return aviso("No se pudo comprobar tu sesión de Pichisoft");
                if (!r.user) return aviso("No tenés una sesión iniciada en Pichisoft");

                box.classList.add("success");
                txt.textContent = "Sesión iniciada";
                await wait(DUR_MENSAJE);
                box.classList.add("hidden");

                var nombre = r.perfil.username || "Usuario";
                nameEl.textContent = nombre;
                var foto = r.perfil.photo;
                if (typeof foto === "string" && /^(data:image\/|https:\/\/)/.test(foto)) {
                    var img = new Image();
                    img.src = foto;
                    img.alt = "Foto de perfil";
                    pic.replaceChildren(img);
                } else {
                    var ph = document.createElement("div");
                    ph.className = "profile-placeholder";
                    ph.textContent = nombre.charAt(0).toUpperCase();
                    pic.replaceChildren(ph);
                }
                await wait(450);
                prof.classList.add("visible");
            })();
        })();
    </script>
<!-- ============================================================
     PICHISOFT · BOTÓN DE AYUDA (estilo premium)
     Pegar al final del <body> de cada app.
     Cambiar SOLO el objeto CONFIG (titulo, descripcion, top, right).
     ============================================================ -->
<script>
(function () {
    'use strict';

    /* ============================================================
       CONFIGURACIÓN — CAMBIAR POR APP
       ============================================================
       titulo       → título del panel (Times New Roman, dorado)
       descripcion  → contenido. Respeta saltos de línea. Admite:
                      <strong>negrita</strong>, <i>cursiva</i>,
                      <a href="...">link</a>
       top          → distancia desde arriba (ajustar según header)
       right        → distancia desde la derecha (ajustar para quedar
                      a la izquierda de los carteles de sesión y del
                      link Pichisoft)
       ============================================================ */
    const CONFIG = {
        titulo: 'Ayuda para PichonRandom',
        descripcion: `PichonRandom es una app para tirar el dado y generar números y letras aleatorios.
Puede sugerir mejoras para esta app <a href="https://mail.google.com/mail/?view=cm&fs=1&to=contacto@pichisoft.cc" target="_blank"
                rel="noopener">aquí</a>.`,
        top: '86px',
        right: '40px'
    };
    /* ============================================================ */

    // Evitar duplicados si se carga dos veces
    if (document.getElementById('psHelpBtn')) return;

    // ─── CSS ───
    const css = document.createElement('style');
    css.textContent = `
/* Botón flotante */
#psHelpBtn {
    position: fixed;
    top: ${CONFIG.top};
    right: ${CONFIG.right};
    z-index: 9998;
    width: 38px;
    height: 38px;
    padding: 0;
    border-radius: 50%;
    border: 2px solid #d4af37;
    background: linear-gradient(135deg, #2b2107, #100c02);
    color: #f1d98a;
    font: bold 20px/1 "Times New Roman", Times, serif;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 14px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.1);
    transition: transform .25s, background .25s, color .25s, box-shadow .25s;
}
#psHelpBtn:hover {
    background: linear-gradient(135deg, #d4af37, #a67c12);
    color: #111;
    transform: scale(1.08);
    box-shadow: 0 6px 20px rgba(212,175,55,.45);
}
#psHelpBtn:focus-visible {
    outline: 2px solid #f1d98a;
    outline-offset: 2px;
}

/* Overlay */
#psHelpOv {
    position: fixed;
    inset: 0;
    z-index: 10000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
    box-sizing: border-box;
    overflow: auto;
    background: rgba(0,0,0,.72);
    backdrop-filter: blur(0);
    -webkit-backdrop-filter: blur(0);
    opacity: 0;
    transition: opacity .35s ease, backdrop-filter .35s ease;
}
#psHelpOv.on {
    opacity: 1;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
}

/* Card */
#psHelpCard {
    position: relative;
    width: min(560px, 100%);
    margin: auto;
    box-sizing: border-box;
    padding: 22px 24px 20px;
    color: #fff;
    background: linear-gradient(180deg, #181818, #0b0b0b);
    border: 2px solid #d4af37;
    border-radius: 16px;
    box-shadow: 0 0 0 1px rgba(212,175,55,.18), 0 30px 80px rgba(0,0,0,.85), 0 0 44px rgba(212,175,55,.12);
    opacity: 0;
    transform: translateY(24px) scale(.95);
    transition: opacity .4s ease, transform .5s cubic-bezier(.2,.9,.25,1.08);
}
#psHelpOv.on #psHelpCard {
    opacity: 1;
    transform: none;
}

/* Título */
#psHelpCard h2 {
    margin: 0 40px 14px 0;
    font: bold 1.7rem "Times New Roman", Times, serif;
    color: #fff;
    line-height: 1.2;
}

/* Contenido */
#psHelpBody {
    font: bold .95rem/1.7 Verdana, "Open Sans", sans-serif;
    color: #fff;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 60vh;
    overflow-y: auto;
    padding-right: 4px;
}
#psHelpBody a,
#psHelpBody a:visited {
    color: #4da3ff;
    text-decoration: underline;
    font-weight: bold;
}
#psHelpBody a:hover { color: #8cc4ff; }
#psHelpBody i { font-style: italic; font-weight: bold; }
#psHelpBody strong { font-weight: bold; color: #fff; }

/* Botón X (CSS puro) */
#psHelpX {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 30px;
    height: 30px;
    padding: 0;
    border: 1.5px solid #d4af37;
    border-radius: 50%;
    background: none;
    cursor: pointer;
    transition: transform .3s, background .2s;
}
#psHelpX::before,
#psHelpX::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 12px;
    height: 2px;
    margin: -1px 0 0 -6px;
    border-radius: 2px;
    background: #f1d98a;
    transition: background .2s;
}
#psHelpX::before { transform: rotate(45deg); }
#psHelpX::after { transform: rotate(-45deg); }
#psHelpX:hover {
    transform: rotate(90deg);
    background: #d4af37;
}
#psHelpX:hover::before,
#psHelpX:hover::after { background: #111; }
#psHelpX:focus-visible {
    outline: 2px solid #f1d98a;
    outline-offset: 2px;
}

/* Botón Entendido */
#psHelpClose {
    display: block;
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #f1d98a;
    cursor: pointer;
    color: #fff;
    font: bold 1rem Georgia, "Times New Roman", serif;
    background: linear-gradient(135deg, #2b2107, #100c02);
    transition: background .3s, color .2s, transform .2s;
}
#psHelpClose:hover {
    background: linear-gradient(135deg, #d4af37, #a67c12);
    color: #111;
    transform: translateY(-2px);
}

/* Responsive */
@media (max-width: 600px) {
    #psHelpBtn {
        top: ${CONFIG.top};
        right: ${CONFIG.right};
        width: 34px;
        height: 34px;
        font-size: 18px;
    }
    #psHelpCard { padding: 18px 16px 16px; }
    #psHelpCard h2 { font-size: 1.4rem; margin-right: 36px; }
}
@media (prefers-reduced-motion: reduce) {
    #psHelpBtn, #psHelpOv, #psHelpCard, #psHelpX, #psHelpClose { transition: none !important; animation: none !important; }
}
`;
    document.head.appendChild(css);

    // ─── Botón flotante ───
    const btn = document.createElement('button');
    btn.id = 'psHelpBtn';
    btn.type = 'button';
    btn.setAttribute('aria-label', 'Ayuda');
    btn.title = 'Ayuda';
    btn.textContent = '?';
    document.body.appendChild(btn);

    // ─── Lógica ───
    let ov = null;
    let onEsc = null;

    function abrir() {
        if (ov) return;

        ov = document.createElement('div');
        ov.id = 'psHelpOv';
        ov.setAttribute('role', 'dialog');
        ov.setAttribute('aria-modal', 'true');
        ov.setAttribute('aria-labelledby', 'psHelpTitle');
        ov.innerHTML = `
            <div id="psHelpCard">
                <button id="psHelpX" type="button" aria-label="Cerrar ayuda" title="Cerrar"></button>
                <h2 id="psHelpTitle"></h2>
                <div id="psHelpBody"></div>
                <button id="psHelpClose" type="button">Entendido</button>
            </div>
        `;
        // Título (texto plano, seguro) y cuerpo (HTML configurado por el dueño de la app)
        ov.querySelector('#psHelpTitle').textContent = CONFIG.titulo;
        ov.querySelector('#psHelpBody').innerHTML = CONFIG.descripcion;
        document.body.appendChild(ov);

        // Forzar reflow para que la animación funcione
        void ov.offsetHeight;
        requestAnimationFrame(() => requestAnimationFrame(() => ov.classList.add('on')));

        // Bloquear scroll de fondo
        document.documentElement.style.overflow = 'hidden';

        // Eventos
        ov.querySelector('#psHelpX').onclick = cerrar;
        ov.querySelector('#psHelpClose').onclick = cerrar;
        ov.addEventListener('click', e => { if (e.target === ov) cerrar(); });

        onEsc = e => { if (e.key === 'Escape') cerrar(); };
        document.addEventListener('keydown', onEsc);

        // Foco al botón de cerrar
        setTimeout(() => { try { ov.querySelector('#psHelpX').focus(); } catch { } }, 300);
    }

    function cerrar() {
        if (!ov) return;
        const el = ov;
        ov = null;
        el.classList.remove('on');
        if (onEsc) { document.removeEventListener('keydown', onEsc); onEsc = null; }
        document.documentElement.style.overflow = '';
        setTimeout(() => el.remove(), 400);
    }

    btn.onclick = abrir;

    // API pública por si querés abrirlo desde código
    window.PichisoftAyuda = { abrir, cerrar };
})();
</script>
</body>

</html>
