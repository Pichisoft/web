<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PichonCalc</title>

    <style>
        body {
            margin: 0;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        .calculator {
            width: 360px;
            background: #1e1e1e;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .header {
            position: fixed;
            top: 15px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .header .title {
            font-family: "Times New Roman", Times, serif;
            font-weight: bold;
            font-size: 40px;
            color: #fff;
        }

        .header .credit {
            font-family: Arial, sans-serif;
            font-style: italic;
            font-weight: normal;
            font-size: 18px;
            color: #aaa;
            position: relative;
            top: 6px;
        }

        /* ===== PANTALLA DE CALCULADORA ===== */
        .display-container {
            position: relative;
            width: 100%;
            height: 80px;
            background: #000;
            border-radius: 8px;
            margin-bottom: 10px;
            padding: 10px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-end;
            transition: background 0.3s ease;
        }

        /* Animación PRO al calcular */
        @keyframes flashResult {
            0% {
                background: #000;
                box-shadow: inset 0 0 0 rgba(15, 255, 0, 0);
            }

            30% {
                background: #0a1a0a;
                box-shadow: inset 0 0 25px rgba(15, 255, 0, 0.3);
            }

            100% {
                background: #000;
                box-shadow: inset 0 0 0 rgba(15, 255, 0, 0);
            }
        }

        .display-container.flash {
            animation: flashResult 0.6s ease-out;
        }

        #preview {
            font-size: 16px;
            color: #888;
            min-height: 20px;
            font-family: monospace;
            pointer-events: none;
            transition: color 0.2s;
        }

        #display {
            font-size: 26px;
            color: #0f0;
            font-family: monospace;
            outline: none;
            width: 100%;
            text-align: right;
            overflow-x: auto;
            white-space: nowrap;
            user-select: text;
        }

        .copy-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 30px;
            height: 30px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #333;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .copy-btn:hover {
            background: #555;
        }

        /* Icono de copiar dibujado en CSS */
        .copy-icon {
            position: relative;
            width: 14px;
            height: 16px;
            border: 2px solid #0f0;
            border-radius: 2px;
            transition: 0.2s;
        }

        .copy-icon::before {
            content: "";
            position: absolute;
            width: 14px;
            height: 16px;
            border: 2px solid #0f0;
            border-radius: 2px;
            left: -4px;
            top: 4px;
            background: #333;
            transition: 0.2s;
        }

        .copy-btn.copied .copy-icon {
            border-color: #fff;
        }

        .copy-btn.copied .copy-icon::before {
            display: none;
        }

        .copy-btn.copied .copy-icon::after {
            content: "✓";
            position: absolute;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            left: -1px;
            top: -5px;
            font-family: Arial, sans-serif;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        button {
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #333;
            color: white;
            transition: transform 0.1s, background 0.2s, box-shadow 0.1s;
            user-select: none;
        }

        button:hover {
            background: #555;
        }

        /* Animación de hundido PRO */
        button:active {
            transform: scale(0.95);
            background: #222;
            box-shadow: inset 0 3px 5px rgba(0, 0, 0, 0.5);
        }

        .eq {
            background: #28a745;
            grid-column: span 4;
        }

        .eq:hover {
            background: #218838;
        }

        .eq:active {
            background: #1e7e34;
            box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.6);
        }

        .clear {
            background: #dc3545;
        }

        .clear:hover {
            background: #c82333;
        }

        .clear:active {
            background: #bd2130;
        }

        /* ==========================================
           PICHISOFT - ESTADO DE SESIÓN
           ========================================== */

        #pichisoft-session-status {
            position: fixed;
            top: 12px;
            right: 120px;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: calc(100vw - 20px);
            box-sizing: border-box;
            padding: 8px 16px;
            background: #000;
            color: #20a84b;
            border: 1px solid rgba(34, 197, 94, 0.25);
            border-radius: 22px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
            font: 14px/1.3 Georgia, serif;
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.6s ease, transform 0.6s ease;
            pointer-events: none;
        }

        #pichisoft-session-status.hidden {
            opacity: 0;
            transform: translateY(-12px);
        }

        #pichisoft-session-status.success {
            font-weight: bold;
        }

        #pichisoft-session-status .ps-check {
            display: none;
            font-size: 20px;
            font-weight: bold;
            line-height: 1;
        }

        #pichisoft-session-status.success .ps-check {
            display: inline-block;
            animation: pichisoftCheck 0.8s cubic-bezier(.17, .89, .32, 1.49) forwards;
        }

        @keyframes pichisoftCheck {
            0% {
                opacity: 0;
                transform: scale(0.2) rotate(-25deg);
            }

            60% {
                opacity: 1;
                transform: scale(1.25) rotate(8deg);
            }

            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        #pichisoft-session-profile {
            position: fixed;
            top: 12px;
            right: 120px;
            z-index: 9998;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: calc(100vw - 20px);
            box-sizing: border-box;
            padding: 5px 14px 5px 5px;
            background: #000;
            color: #fff;
            border: 1px solid rgba(34, 197, 94, 0.25);
            border-radius: 25px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
            font-family: Georgia, serif;
            opacity: 0;
            transform: translateY(-12px) scale(0.9);
            transition: opacity 0.7s ease, transform 0.7s cubic-bezier(.17, .89, .32, 1.3);
            pointer-events: none;
        }

        #pichisoft-session-profile.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        #pichisoft-profile-picture img,
        #pichisoft-profile-picture .profile-placeholder {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #pichisoft-profile-picture .profile-placeholder {
            background: #20a84b;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
        }

        #pichisoft-profile-name {
            font-size: 14px;
            font-weight: bold;
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        @media (max-width: 600px) {
            .header {
                left: 12px;
            }

            .header .title {
                font-size: 26px;
            }

            .header .credit {
                font-size: 12px;
                top: 2px;
            }

            #pichisoft-session-status,
            #pichisoft-session-profile {
                top: 56px;
                right: 10px;
            }

            #pichisoft-session-status {
                font-size: 13px;
                padding: 7px 14px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <span class="title">PichonCalc</span>
        <span class="credit">- By Pichisoft -</span>
    </div>

    <div class="calculator" id="calc">

        <div class="display-container" id="displayContainer">
            <button class="copy-btn" id="copyBtn" onclick="copyResult()" title="Copiar resultado">
                <span class="copy-icon"></span>
            </button>
            <div id="preview"></div>
            <div id="display" autofocus></div>
        </div>

        <div class="buttons">

            <button onclick="append('(')">(</button>
            <button onclick="append(')')">)</button>
            <button onclick="clearDisplay()" class="clear">C</button>
            <button onclick="del()">DEL</button>

            <button onclick="append('7')">7</button>
            <button onclick="append('8')">8</button>
            <button onclick="append('9')">9</button>
            <button onclick="append('/')">/</button>

            <button onclick="append('4')">4</button>
            <button onclick="append('5')">5</button>
            <button onclick="append('6')">6</button>
            <button onclick="append('*')">*</button>

            <button onclick="append('1')">1</button>
            <button onclick="append('2')">2</button>
            <button onclick="append('3')">3</button>
            <button onclick="append('-')">-</button>

            <button onclick="append('0')">0</button>
            <button onclick="append('.')">.</button>
            <button onclick="append('+')">+</button>

            <button class="eq" onclick="calculate(event)">=</button>

        </div>
    </div>

    <script>
        const displayEl = document.getElementById("display");
        const previewEl = document.getElementById("preview");
        const displayContainer = document.getElementById("displayContainer");
        const copyBtn = document.getElementById("copyBtn");

        let currentExpression = "";
        let lastExpression = "";

        let vars = { a: 10, b: 5, c: 0, d: 2 };

        function replaceLetters(expr) {
            return expr.replace(/[a-z]/gi, m => vars[m] !== undefined ? vars[m] : m);
        }

        function safeEval(expr) {
            if (!expr) return "";
            expr = replaceLetters(expr);
            if (!/^[0-9+\-*/().\s]+$/.test(expr)) return "";
            try {
                let res = Function('"use strict";return (' + expr + ')')();
                if (!isFinite(res) || isNaN(res)) return "";
                return Math.round(res * 100000000) / 100000000;
            } catch {
                return "";
            }
        }

        function updateDisplay() {
            displayEl.textContent = currentExpression || "0";

            if (currentExpression.trim() === "" || currentExpression === "0") {
                previewEl.textContent = "";
            } else {
                let res = safeEval(currentExpression);
                previewEl.textContent = (res !== "" && res !== currentExpression) ? "= " + res : "";
            }
        }

        function append(v) {
            if (currentExpression === "Error" || (lastExpression && displayEl.textContent === lastExpression.toString())) {
                if (!isNaN(v) || v === "(") {
                    currentExpression = "";
                    lastExpression = "";
                }
            }
            currentExpression += v;
            updateDisplay();
        }

        function clearDisplay() {
            currentExpression = "";
            lastExpression = "";
            updateDisplay();
        }

        function del() {
            currentExpression = currentExpression.slice(0, -1);
            updateDisplay();
        }

        function calculate(e) {
            if (!currentExpression) return;

            let expr = currentExpression;
            let result = safeEval(expr);

            if (result === "") {
                displayEl.textContent = "Error";
                previewEl.textContent = "";
                currentExpression = "";
                lastExpression = "";
                return;
            }

            currentExpression = result.toString();
            lastExpression = currentExpression;
            displayEl.textContent = currentExpression;
            previewEl.textContent = "";

            // Animación PRO en vez de confeti
            displayContainer.classList.remove("flash");
            void displayContainer.offsetWidth; // Truco para reiniciar la animación
            displayContainer.classList.add("flash");
        }

        function copyResult() {
            // Si hay un resultado en la vista previa (ej. "= 25"), copia eso.
            // Si no, copia el resultado principal.
            let textToCopy = displayEl.textContent;
            let previewText = previewEl.textContent;

            if (previewText && previewText.startsWith("= ")) {
                textToCopy = previewText.replace("= ", "").trim();
            }

            if (!textToCopy || textToCopy === "Error" || textToCopy === "0") return;

            navigator.clipboard.writeText(textToCopy).then(() => {
                copyBtn.classList.add("copied");
                setTimeout(() => copyBtn.classList.remove("copied"), 2000);
            }).catch(() => {
                let ta = document.createElement("textarea");
                ta.value = textToCopy;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand("copy");
                ta.remove();
                copyBtn.classList.add("copied");
                setTimeout(() => copyBtn.classList.remove("copied"), 2000);
            });
        }

        document.addEventListener("keydown", (e) => {
            const key = e.key;

            if (/^[0-9+\-*/().]$/.test(key)) {
                e.preventDefault();
                append(key);
            } else if (key === "Enter" || key === "=") {
                e.preventDefault();
                calculate({ target: document.querySelector(".eq") });
            } else if (key === "Backspace") {
                e.preventDefault();
                del();
            } else if (key === "Escape" || key === "Delete") {
                e.preventDefault();
                clearDisplay();
            }
        });

        updateDisplay();
    </script>

    <p style="position: fixed; top: 15px; right: 20px; font-weight: bold; margin: 0; z-index: 9999; color:#fff;"><a
            href="https://pichisoft.cc" target="_blank" style="color:#4db8ff; text-decoration: underline;">Pichisoft</a>
    </p>

    <!-- ===== Pichisoft - Estado de sesión ===== -->
    <div id="pichisoft-session-status" role="status" aria-live="polite">
        <span class="ps-check">✓</span>
        <span class="ps-text">Iniciando sesión en tu cuenta de Pichisoft...</span>
    </div>

    <div id="pichisoft-session-profile">
        <div id="pichisoft-profile-picture"></div>
        <span id="pichisoft-profile-name"></span>
    </div>

    <script>
        (function () {
            var CFG = {
                apiKey: "AIzaSyCf_P8qp9nBUnsVe3qsTAtZJjZHOktKf-8",
                authDomain: "pichisoft.firebaseapp.com",
                projectId: "pichisoft",
                storageBucket: "pichisoft.firebasestorage.app",
                messagingSenderId: "690032082295",
                appId: "1:690032082295:web:b7f0e8cb8fcceb26e9b572",
                measurementId: "G-K7HRKR8BJ1"
            };
            var V = "https://www.gstatic.com/firebasejs/12.3.0/";
            var DUR_INICIO = 12000;
            var DUR_MENSAJE = 6000;

            var box = document.getElementById("pichisoft-session-status");
            var txt = box.querySelector(".ps-text");
            var prof = document.getElementById("pichisoft-session-profile");
            var pic = document.getElementById("pichisoft-profile-picture");
            var nameEl = document.getElementById("pichisoft-profile-name");
            var t0 = Date.now();

            function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

            async function comprobar() {
                try {
                    var m = await Promise.all([
                        import(V + "firebase-app.js"),
                        import(V + "firebase-auth.js"),
                        import(V + "firebase-firestore.js")
                    ]);
                    var app = m[0].initializeApp(CFG);
                    var auth = m[1].getAuth(app);
                    var db = m[2].getFirestore(app);

                    var user = await Promise.race([
                        new Promise(function (res) {
                            m[1].onAuthStateChanged(auth, function (u) {
                                window.PichisoftFirebase = { auth: auth, db: db, currentUser: u };
                                res(u);
                            });
                        }),
                        wait(15000).then(function () { throw new Error("tiempo agotado"); })
                    ]);

                    var perfil = {};
                    if (user) {
                        try {
                            var snap = await m[2].getDoc(m[2].doc(db, "users", user.uid));
                            if (snap.exists()) perfil = snap.data();
                        } catch (e) { }
                    }
                    return { user: user, perfil: perfil };
                } catch (e) {
                    return { error: true };
                }
            }

            async function aviso(texto) {
                txt.textContent = texto;
                await wait(DUR_MENSAJE);
                box.classList.add("hidden");
            }

            (async function () {
                var r = await comprobar();
                await wait(Math.max(0, DUR_INICIO - (Date.now() - t0)));

                if (r.error) return aviso("No se pudo comprobar tu sesión de Pichisoft");
                if (!r.user) return aviso("No tenés una sesión iniciada en Pichisoft");

                box.classList.add("success");
                txt.textContent = "Sesión iniciada";
                await wait(DUR_MENSAJE);
                box.classList.add("hidden");

                var nombre = r.perfil.username || "Usuario";
                nameEl.textContent = nombre;
                var foto = r.perfil.photo;
                if (typeof foto === "string" && /^(data:image\/|https:\/\/)/.test(foto)) {
                    var img = new Image();
                    img.src = foto;
                    img.alt = "Foto de perfil";
                    pic.replaceChildren(img);
                } else {
                    var ph = document.createElement("div");
                    ph.className = "profile-placeholder";
                    ph.textContent = nombre.charAt(0).toUpperCase();
                    pic.replaceChildren(ph);
                }
                await wait(450);
                prof.classList.add("visible");
            })();
        })();
    </script>
</body>

</html>
