<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PichonCalc</title>

    <style>
        body {
            margin: 0;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        .calculator {
            width: 360px;
            background: #1e1e1e;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .header {
            position: fixed;
            top: 15px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .header .title {
            font-family: "Times New Roman", Times, serif;
            font-weight: bold;
            font-size: 40px;
            color: #fff;
        }

        .header .credit {
            font-family: Arial, sans-serif;
            font-style: italic;
            font-weight: normal;
            font-size: 18px;
            color: #aaa;
            position: relative;
            top: 6px;
        }

        #display {
            width: 100%;
            height: 60px;
            font-size: 22px;
            text-align: right;
            padding: 10px;
            border: none;
            border-radius: 8px;
            margin-bottom: 10px;
            background: #000;
            color: #0f0;
            outline: none;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        button {
            padding: 12px;
            font-size: 13px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #333;
            color: white;
        }

        button:hover {
            background: #555;
        }

        .eq {
            background: #28a745;
            grid-column: span 4;
        }

        .clear {
            background: #dc3545;
        }

        /* partículas */
        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            pointer-events: none;
            animation: fly 600ms linear forwards;
        }

        @keyframes fly {
            from {
                transform: translate(0, 0);
                opacity: 1;
            }

            to {
                transform: translate(var(--x), var(--y));
                opacity: 0;
            }
        }

        .credit {
            font-family: Verdana, sans-serif;
            font-size: 18px;
            font-style: italic;
            color: #bbb;
        }

        /* ==========================================
           PICHISOFT - ESTADO DE SESIÓN
           ========================================== */

        #pichisoft-session-status {
            position: fixed;
            top: 52px;
            right: 20px;
            z-index: 9999;

            display: flex;
            align-items: center;
            gap: 8px;

            max-width: calc(100vw - 20px);
            box-sizing: border-box;
            padding: 8px 16px;

            background: #000;
            color: #20a84b;

            border: 1px solid rgba(34, 197, 94, 0.25);
            border-radius: 22px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);

            font: 14px/1.3 Georgia, serif;

            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.6s ease, transform 0.6s ease;
            pointer-events: none;
        }

        #pichisoft-session-status.hidden {
            opacity: 0;
            transform: translateY(-12px);
        }

        #pichisoft-session-status.success {
            font-weight: bold;
        }

        #pichisoft-session-status .ps-check {
            display: none;
            font-size: 20px;
            font-weight: bold;
            line-height: 1;
        }

        #pichisoft-session-status.success .ps-check {
            display: inline-block;
            animation: pichisoftCheck 0.8s cubic-bezier(.17, .89, .32, 1.49) forwards;
        }

        @keyframes pichisoftCheck {
            0% {
                opacity: 0;
                transform: scale(0.2) rotate(-25deg);
            }

            60% {
                opacity: 1;
                transform: scale(1.25) rotate(8deg);
            }

            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        #pichisoft-session-profile {
            position: fixed;
            top: 52px;
            right: 20px;
            z-index: 9998;

            display: flex;
            align-items: center;
            gap: 8px;

            max-width: calc(100vw - 20px);
            box-sizing: border-box;
            padding: 5px 14px 5px 5px;

            background: #000;
            color: #fff;

            border: 1px solid rgba(34, 197, 94, 0.25);
            border-radius: 25px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);

            font-family: Georgia, serif;

            opacity: 0;
            transform: translateY(-12px) scale(0.9);
            transition: opacity 0.7s ease, transform 0.7s cubic-bezier(.17, .89, .32, 1.3);
            pointer-events: none;
        }

        #pichisoft-session-profile.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        #pichisoft-profile-picture img,
        #pichisoft-profile-picture .profile-placeholder {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #pichisoft-profile-picture .profile-placeholder {
            background: #20a84b;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
        }

        #pichisoft-profile-name {
            font-size: 14px;
            font-weight: bold;
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Celular: título más chico (para que no choque con el link "Pichisoft")
           y el cartel queda arriba de la calculadora, sin tapar nada */
        @media (max-width: 600px) {
            .header {
                left: 12px;
            }

            .header .title {
                font-size: 26px;
            }

            .header .credit {
                font-size: 12px;
                top: 2px;
            }

            #pichisoft-session-status,
            #pichisoft-session-profile {
                top: 56px;
                right: 10px;
            }

            #pichisoft-session-status {
                font-size: 13px;
                padding: 7px 14px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <span class="title">PichonCalc</span>
        <span class="credit">- By Pichisoft -</span>
    </div>

    <div class="calculator" id="calc">

        <input id="display" type="text" autofocus />

        <div class="buttons">

            <button onclick="append('(')">(</button>
            <button onclick="append(')')">)</button>
            <button onclick="clearDisplay()" class="clear">C</button>
            <button onclick="del()">DEL</button>

            <button onclick="append('7')">7</button>
            <button onclick="append('8')">8</button>
            <button onclick="append('9')">9</button>
            <button onclick="append('/')">/</button>

            <button onclick="append('4')">4</button>
            <button onclick="append('5')">5</button>
            <button onclick="append('6')">6</button>
            <button onclick="append('*')">*</button>

            <button onclick="append('1')">1</button>
            <button onclick="append('2')">2</button>
            <button onclick="append('3')">3</button>
            <button onclick="append('-')">-</button>

            <button onclick="append('0')">0</button>
            <button onclick="append('.')">.</button>
            <button onclick="append('+')">+</button>

            <button class="eq" onclick="calculate(event)">=</button>

        </div>
    </div>

    <script>
        const display = document.getElementById("display");
        const calc = document.getElementById("calc");

        let lastExpression = "";

        /* ===== VARIABLES ===== */
        let vars = { a: 10, b: 5, c: 0, d: 2 };

        /* ===== UTIL ===== */
        function sanitize(expr) {
            return expr.replace(/Math\./g, "");
        }

        function replaceLetters(expr) {
            return expr.replace(/[a-z]/gi, m => vars[m] ?? m);
        }

        /* ===== INPUT ===== */
        function append(v) {
            display.value += v;
        }

        function clearDisplay() { display.value = ""; }
        function del() { display.value = display.value.slice(0, -1); }

        /* ===== PARTICULAS ===== */
        function spawnParticles(x, y) {
            for (let i = 0; i < 20; i++) {
                let p = document.createElement("div");
                p.className = "particle";

                p.style.left = x + "px";
                p.style.top = y + "px";

                let angle = Math.random() * Math.PI * 2;
                let dist = Math.random() * 80;

                p.style.setProperty("--x", Math.cos(angle) * dist + "px");
                p.style.setProperty("--y", Math.sin(angle) * dist + "px");

                p.style.background = `hsl(${Math.random() * 360},100%,60%)`;

                calc.appendChild(p);
                setTimeout(() => p.remove(), 600);
            }
        }

        /* ===== CALCULAR ===== */
        function calculate(e) {
            try {
                let expr = display.value;

                if (expr.trim() === "" && lastExpression) {
                    expr = lastExpression;
                }

                expr = sanitize(expr);
                expr = replaceLetters(expr);

                let result = eval(expr);

                display.value = result;
                lastExpression = expr;

                let rect = e.target.getBoundingClientRect();
                spawnParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);

            } catch {
                display.value = "Error";
            }
        }

        /* ===== TECLADO ===== */
        document.addEventListener("keydown", (e) => {
            const key = e.key.toLowerCase();
            const allowed = "0123456789+-*/().abcdefghijklmnopqrstuvwxyz";

            if (allowed.includes(key)) {
                e.preventDefault();
                append(key);
            } else if (key === "enter") {
                e.preventDefault();
                calculate({ target: document.querySelector(".eq") });
            } else if (key === "backspace") {
                e.preventDefault();
                del();
            } else if (key === "escape") {
                e.preventDefault();
                clearDisplay();
            }
        });
    </script>
    <p style="position: fixed; top: 15px; right: 20px; font-weight: bold; margin: 0; z-index: 9999; color:#fff;"><a
            href="https://pichisoft.github.io/web/" target="_blank"
            style="color:#4db8ff; text-decoration: underline;">Pichisoft</a></p>

    <!-- ===== Pichisoft - Estado de sesión ===== -->
    <div id="pichisoft-session-status" role="status" aria-live="polite">
        <span class="ps-check">✓</span>
        <span class="ps-text">Iniciando sesión en tu cuenta de Pichisoft...</span>
    </div>

    <div id="pichisoft-session-profile">
        <div id="pichisoft-profile-picture"></div>
        <span id="pichisoft-profile-name"></span>
    </div>

    <script>
        (function () {
            /* Todo va dentro de esta función para no chocar con las variables de la app */
            var CFG = {
                apiKey: "AIzaSyCf_P8qp9nBUnsVe3qsTAtZJjZHOktKf-8",
                authDomain: "pichisoft.firebaseapp.com",
                projectId: "pichisoft",
                storageBucket: "pichisoft.firebasestorage.app",
                messagingSenderId: "690032082295",
                appId: "1:690032082295:web:b7f0e8cb8fcceb26e9b572",
                measurementId: "G-K7HRKR8BJ1"
            };
            var V = "https://www.gstatic.com/firebasejs/12.3.0/";
            var DUR_INICIO = 12000;   // "Iniciando sesión..."
            var DUR_MENSAJE = 6000;   // "Sesión iniciada" / avisos

            var box = document.getElementById("pichisoft-session-status");
            var txt = box.querySelector(".ps-text");
            var prof = document.getElementById("pichisoft-session-profile");
            var pic = document.getElementById("pichisoft-profile-picture");
            var nameEl = document.getElementById("pichisoft-profile-name");
            var t0 = Date.now();

            function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

            /* Espera a que Firebase confirme si hay sesión y lee el perfil.
               Si algo falla (sin internet, permisos, etc.) devuelve {error:true} en vez de quedarse trabado. */
            async function comprobar() {
                try {
                    var m = await Promise.all([
                        import(V + "firebase-app.js"),
                        import(V + "firebase-auth.js"),
                        import(V + "firebase-firestore.js")
                    ]);
                    var app = m[0].initializeApp(CFG);
                    var auth = m[1].getAuth(app);
                    var db = m[2].getFirestore(app);

                    var user = await Promise.race([
                        new Promise(function (res) {
                            m[1].onAuthStateChanged(auth, function (u) {
                                window.PichisoftFirebase = { auth: auth, db: db, currentUser: u };
                                res(u);
                            });
                        }),
                        wait(15000).then(function () { throw new Error("tiempo agotado"); })
                    ]);

                    var perfil = {};
                    if (user) {
                        try {
                            var snap = await m[2].getDoc(m[2].doc(db, "users", user.uid));
                            if (snap.exists()) perfil = snap.data();
                        } catch (e) {
                            console.error("Pichisoft: no se pudo leer el perfil", e);
                        }
                    }
                    return { user: user, perfil: perfil };
                } catch (e) {
                    console.error("Pichisoft:", e);
                    return { error: true };
                }
            }

            async function aviso(texto) {
                txt.textContent = texto;
                await wait(DUR_MENSAJE);
                box.classList.add("hidden");
            }

            (async function () {
                var r = await comprobar();
                await wait(Math.max(0, DUR_INICIO - (Date.now() - t0)));

                if (r.error) return aviso("No se pudo comprobar tu sesión de Pichisoft");
                if (!r.user) return aviso("No tenés una sesión iniciada en Pichisoft");

                box.classList.add("success");
                txt.textContent = "Sesión iniciada";
                await wait(DUR_MENSAJE);
                box.classList.add("hidden");

                var nombre = r.perfil.username || "Usuario";
                nameEl.textContent = nombre;
                var foto = r.perfil.photo;
                if (typeof foto === "string" && /^(data:image\/|https:\/\/)/.test(foto)) {
                    var img = new Image();
                    img.src = foto;
                    img.alt = "Foto de perfil";
                    pic.replaceChildren(img);
                } else {
                    var ph = document.createElement("div");
                    ph.className = "profile-placeholder";
                    ph.textContent = nombre.charAt(0).toUpperCase();
                    pic.replaceChildren(ph);
                }
                await wait(450);
                prof.classList.add("visible");
            })();
        })();
    </script>
</body>

</html>
