<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PichonCode - By Pichisoft</title>
    <style>
        * {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%;
            margin: 0;
            background: #1e1e1e;
            color: #ccc;
            font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
            overflow: hidden
        }

        button,
        select,
        input {
            font: inherit;
            color: inherit
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            height: 28px;
            z-index: 10000;
            display: flex;
            align-items: baseline;
            gap: 8px;
            padding: 5px 10px 0;
            pointer-events: none
        }

        .logo {
            font-family: "Times New Roman", Times, serif;
            font-weight: bold;
            color: #fff;
            font-size: 1.05rem;
            line-height: 1
        }

        .byline {
            color: #888;
            font-style: italic;
            font-size: .72rem
        }

        .plink {
            position: fixed;
            top: 0;
            right: 12px;
            height: 28px;
            line-height: 28px;
            z-index: 10000;
            color: #3b82f6;
            text-decoration: underline;
            text-decoration-color: #3b82f6;
            font-size: 13px
        }

        #app {
            position: fixed;
            inset: 28px 0 0 0;
            display: flex;
            flex-direction: column
        }

        #bar {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            align-items: center;
            padding: 3px 8px;
            background: #333;
            border-bottom: 1px solid #252526
        }

        #bar button,
        #bar select {
            background: #3c3c3c;
            border: 1px solid #4a4a4a;
            border-radius: 3px;
            padding: 2px 8px;
            cursor: pointer
        }

        #bar button:hover {
            background: #505050
        }

        #bar .run {
            background: #16825d;
            border-color: #16825d;
            color: #fff
        }

        #main {
            flex: 1;
            display: flex;
            min-height: 0
        }

        #side {
            width: 250px;
            background: #252526;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #333;
            min-width: 0
        }

        #side.off {
            display: none
        }

        .stabs {
            display: flex;
            border-bottom: 1px solid #333
        }

        .stabs button {
            flex: 1;
            background: none;
            border: 0;
            padding: 6px;
            cursor: pointer;
            color: #999;
            border-bottom: 2px solid transparent
        }

        .stabs button.on {
            color: #fff;
            border-color: #3b82f6
        }

        .sbtn {
            display: flex;
            gap: 4px;
            padding: 4px 8px
        }

        .sbtn button {
            background: none;
            border: 0;
            cursor: pointer;
            padding: 2px 6px;
            color: #ccc;
            border-radius: 3px
        }

        .sbtn button:hover {
            background: #3a3a3a
        }

        #tree,
        #sres {
            flex: 1;
            overflow: auto;
            padding-bottom: 20px
        }

        .it {
            display: flex;
            align-items: center;
            padding: 2px 8px;
            cursor: pointer;
            white-space: nowrap;
            gap: 4px
        }

        .it:hover {
            background: #2a2d2e
        }

        .it.on {
            background: #37373d;
            color: #fff
        }

        .it .n {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .it .a {
            display: none
        }

        .it:hover .a {
            display: inline
        }

        .it .a i {
            font-style: normal;
            padding: 0 3px;
            opacity: .7
        }

        .it .a i:hover {
            opacity: 1
        }

        #sres {
            display: none
        }

        #sq {
            margin: 6px 8px;
            padding: 4px 6px;
            background: #3c3c3c;
            border: 1px solid #555;
            border-radius: 3px;
            display: none
        }

        .rf {
            padding: 4px 8px;
            color: #fff;
            font-weight: bold
        }

        .rl {
            padding: 1px 8px 1px 18px;
            cursor: pointer;
            color: #aaa;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .rl:hover {
            background: #2a2d2e
        }

        #cwrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0
        }

        #tabs {
            display: flex;
            overflow-x: auto;
            background: #252526;
            min-height: 32px
        }

        .tab {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 10px;
            cursor: pointer;
            background: #2d2d2d;
            border-right: 1px solid #1e1e1e;
            white-space: nowrap;
            color: #999
        }

        .tab.on {
            background: #1e1e1e;
            color: #fff;
            border-top: 1px solid #3b82f6
        }

        .tab b {
            font-weight: normal;
            opacity: .6;
            padding: 0 3px;
            border-radius: 3px
        }

        .tab b:hover {
            background: #444;
            opacity: 1
        }

        #ed {
            flex: 1;
            min-height: 0
        }

        #panel {
            height: 220px;
            display: flex;
            flex-direction: column;
            border-top: 1px solid #3b3b3b;
            background: #1e1e1e
        }

        #panel.off {
            display: none
        }

        .ptabs {
            display: flex;
            gap: 2px;
            background: #252526;
            align-items: center
        }

        .ptabs button {
            background: none;
            border: 0;
            padding: 4px 12px;
            cursor: pointer;
            color: #999;
            border-bottom: 2px solid transparent
        }

        .ptabs button.on {
            color: #fff;
            border-color: #3b82f6
        }

        #con {
            flex: 1;
            overflow: auto;
            padding: 6px 10px;
            font: 12px Consolas, monospace;
            white-space: pre-wrap
        }

        #con .e {
            color: #f48771
        }

        #con .w {
            color: #cca700
        }

        #con .i {
            color: #75beff
        }

        #prev {
            flex: 1;
            border: 0;
            background: #fff;
            display: none
        }

        #status {
            height: 22px;
            background: #007acc;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0 10px;
            font-size: 12px
        }

        #status span {
            cursor: default
        }

        #lock {
            position: fixed;
            inset: 0;
            z-index: 20000;
            background: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-align: center;
            padding: 20px
        }

        #lock h1 {
            font: bold 2rem "Times New Roman", serif;
            color: #fff;
            margin: 0
        }

        #lock p {
            margin: 0;
            color: #aaa;
            max-width: 420px
        }

        #lock a {
            background: #3b82f6;
            color: #fff;
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 6px;
            display: none
        }

        #lock.deny a {
            display: inline-block
        }

        /* ==========================================
   PICHISOFT - ESTADO DE SESIÓN (compacto, arriba a la izquierda del link)
   ========================================== */
        #pichisoft-session-status {
            position: fixed;
            top: 3px;
            right: 90px;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 6px;
            max-width: calc(100vw - 230px);
            box-sizing: border-box;
            padding: 2px 10px;
            background: #000;
            color: #20a84b;
            border: 1px solid rgba(34, 197, 94, .25);
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, .25);
            font: 12px/1.3 Georgia, serif;
            text-align: left;
            white-space: nowrap;
            opacity: 1;
            transform: translateY(0);
            transition: opacity .6s ease, transform .6s ease;
            pointer-events: none
        }

        #pichisoft-session-status.hidden {
            opacity: 0;
            transform: translateY(-8px)
        }

        #pichisoft-session-status.success {
            font-weight: bold
        }

        #pichisoft-session-status .ps-check {
            display: none;
            font-size: 14px;
            font-weight: bold;
            line-height: 1
        }

        #pichisoft-session-status.success .ps-check {
            display: inline-block;
            animation: pichisoftCheck .8s cubic-bezier(.17, .89, .32, 1.49) forwards
        }

        @keyframes pichisoftCheck {
            0% {
                opacity: 0;
                transform: scale(.2) rotate(-25deg)
            }

            60% {
                opacity: 1;
                transform: scale(1.25) rotate(8deg)
            }

            100% {
                opacity: 1;
                transform: scale(1) rotate(0)
            }
        }

        #pichisoft-session-profile {
            position: fixed;
            top: 2px;
            right: 90px;
            z-index: 9998;
            display: flex;
            align-items: center;
            gap: 6px;
            max-width: calc(100vw - 230px);
            box-sizing: border-box;
            padding: 2px 10px 2px 2px;
            background: #000;
            color: #fff;
            border: 1px solid rgba(34, 197, 94, .25);
            border-radius: 16px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, .25);
            font-family: Georgia, serif;
            text-align: left;
            opacity: 0;
            transform: translateY(-8px) scale(.9);
            transition: opacity .7s ease, transform .7s cubic-bezier(.17, .89, .32, 1.3);
            pointer-events: none
        }

        #pichisoft-session-profile.visible {
            opacity: 1;
            transform: translateY(0) scale(1)
        }

        #pichisoft-profile-picture img,
        #pichisoft-profile-picture .profile-placeholder {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center
        }

        #pichisoft-profile-picture .profile-placeholder {
            background: #20a84b;
            color: #fff;
            font-size: 11px;
            font-weight: bold
        }

        #pichisoft-profile-name {
            font-size: 12px;
            font-weight: bold;
            max-width: 110px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        @media (max-width:600px) {
            .header {
                padding: 6px 6px 0;
                gap: 5px
            }

            .logo {
                font-size: .9rem
            }

            .byline {
                display: none
            }

            .plink {
                right: 8px;
                font-size: 12px
            }

            #pichisoft-session-status,
            #pichisoft-session-profile {
                right: 66px;
                max-width: calc(100vw - 150px)
            }

            #pichisoft-session-status {
                font-size: 11px;
                padding: 2px 8px
            }

            #side {
                position: absolute;
                z-index: 50;
                top: 0;
                bottom: 0;
                height: 100%
            }
        }
    </style>
</head>
