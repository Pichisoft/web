<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>PichonBirthday - By Pichisoft</title>
    <style>
        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0;
            min-height: 100%
        }

        body {
            background: radial-gradient(1200px 600px at 50% -10%, #1b1b2b, #0b0b10 60%);
            color: #fff;
            font-family: Georgia, serif;
            min-height: 100vh
        }

        button {
            font-family: inherit;
            cursor: pointer
        }

        /* Cabecera */
        .header {
            position: absolute;
            top: 20px;
            left: 24px;
            max-width: calc(100vw - 150px);
            z-index: 5
        }

        .logo {
            margin: 0;
            font: bold 2rem "Times New Roman", Times, serif;
            color: #fff;
            line-height: 1.2
        }

        .byline {
            font: italic normal 1rem "Times New Roman", Times, serif;
            color: #9a9aa5
        }

        .plink {
            position: fixed;
            top: 16px;
            right: 20px;
            z-index: 10000;
            font: bold 16px Verdana, Geneva, sans-serif;
            color: #2f7bff;
            text-decoration: underline;
            text-decoration-color: #2f7bff
        }

        /* Inicio */
        #home {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 90px 20px 30px
        }

        .gift-btn {
            font: 2.6rem Georgia, serif;
            color: #fff;
            background: linear-gradient(135deg, #ffffff14, #ffffff05);
            border: 1px solid #ffffff40;
            border-radius: 18px;
            padding: 22px 44px;
            transition: .25s;
            box-shadow: 0 10px 40px #0008
        }

        .gift-btn:hover {
            transform: translateY(-3px) scale(1.03);
            border-color: #fff;
            box-shadow: 0 14px 50px #5aa9ff33
        }

        /* Editor */
        .hw {
            text-align: center;
            width: min(560px, 100%)
        }

        .mine {
            margin-top: 34px;
            text-align: left
        }

        .mine h3 {
            margin: 0 0 8px;
            font: normal 1rem Georgia, serif;
            color: #9a9aa5
        }

        .gl {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 12px;
            border: 1px solid #ffffff25;
            border-radius: 10px;
            margin-bottom: 6px;
            background: #ffffff0a
        }

        .gl a,
        .gl span {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #fff
        }

        .gl small {
            color: #9a9aa5
        }

        #editor {
            display: none;
            max-width: 980px;
            margin: 0 auto;
            padding: 84px 12px 30px
        }

        #editor.on {
            display: block
        }

        #home.off {
            display: none
        }

        .ti {
            width: 100%;
            background: #14141c;
            color: #fff;
            border: 1px solid #ffffff30;
            border-radius: 10px;
            padding: 10px 12px;
            font: 17px Georgia, serif;
            margin-bottom: 8px
        }

        .bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            padding: 8px;
            background: #14141c;
            border: 1px solid #ffffff22;
            border-radius: 12px;
            margin-bottom: 10px
        }

        .bar select,
        .b {
            background: #1e1e2a;
            color: #fff;
            border: 1px solid #ffffff30;
            border-radius: 8px;
            padding: 7px 10px;
            font-size: 14px
        }

        .b:hover:not(:disabled),
        .bar select:hover {
            border-color: #fff
        }

        .b:disabled {
            opacity: .35;
            cursor: default
        }

        .sw {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            max-width: 250px
        }

        .sw i {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #ffffff55;
            cursor: pointer;
            display: block
        }

        .gs {
            width: 44px;
            height: 30px;
            border-radius: 8px;
            border: 2px solid #ffffff55;
            cursor: pointer;
            display: block
        }

        .add {
            background: #fff;
            color: #000;
            border: 0;
            border-radius: 10px;
            padding: 12px 26px;
            font-size: 17px;
            font-weight: bold
        }

        .back {
            background: none;
            color: #ccc;
            border: 1px solid #ffffff40;
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 15px
        }

        .ok {
            background: #22c55e;
            color: #000;
            border: 0;
            border-radius: 8px;
            padding: 8px 12px;
            font-weight: bold;
            font-size: 14px
        }

        .mid {
            display: flex;
            justify-content: center;
            position: relative;
            margin: 14px 0
        }

        .panel {
            display: none;
            position: absolute;
            left: calc(50% - 180px);
            bottom: calc(100% + 8px);
            width: 360px;
            max-height: 70vh;
            overflow: auto;
            background: #1b1b27;
            border: 1px solid #ffffff33;
            border-radius: 14px;
            padding: 8px;
            box-shadow: 0 14px 50px #000c;
            z-index: 50
        }

        .panel.on {
            display: block
        }

        .panel hr {
            border: 0;
            border-top: 1px solid #ffffff22;
            margin: 6px 0
        }

        .opt {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            background: none;
            border: 0;
            color: #fff;
            font-size: 16px;
            padding: 10px 12px;
            border-radius: 9px;
            text-align: left
        }

        .opt:hover {
            background: #ffffff18
        }

        .opt small {
            display: block;
            color: #9a9aa5;
            font-size: 12px
        }

        #wrap {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 14px;
            border: 1px solid #ffffff30;
            background: #000
        }

        .stg {
            position: absolute;
            left: 0;
            top: 0;
            width: 800px;
            height: 600px;
            transform-origin: 0 0;
            overflow: hidden;
            isolation: isolate
        }

        .it {
            position: absolute;
            box-sizing: border-box;
            touch-action: none;
            font: 20px/1.4 Georgia, serif;
            color: #fff
        }

        .edit .it:not(.ed2) {
            cursor: move;
            user-select: none;
            -webkit-user-select: none
        }

        .it.sel {
            outline: 2px solid #5aa9ff
        }

        .it.ed2 {
            outline: 2px dashed #ffc400
        }

        .tx {
            font-size: 28px;
            min-height: 1.4em;
            outline: none;
            word-break: break-word;
            padding: 4px
        }

        .ed2 .tx {
            cursor: text;
            user-select: text;
            -webkit-user-select: text
        }

        .it img,
        .it video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            border-radius: inherit
        }

        .it audio {
            width: 100%;
            display: block
        }

        .edit .it img,
        .edit .it video,
        .edit .it audio {
            pointer-events: none
        }

        .cl {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
            gap: 4px
        }

        .it[data-k=chip],
        .it[data-k=cd] {
            width: max-content
        }

        .chip {
            display: inline-flex;
            gap: 8px;
            align-items: center;
            padding: 10px 16px;
            border-radius: 999px;
            background: #ffffff1c;
            border: 1px solid #ffffff55;
            font-size: 18px;
            white-space: nowrap
        }

        .view .chip {
            cursor: pointer
        }

        .bub {
            position: absolute;
            left: 0;
            top: 100%;
            margin-top: 6px;
            min-width: 180px;
            max-width: 320px;
            padding: 12px 14px;
            background: #fff;
            color: #111;
            border-radius: 12px;
            font-size: 17px;
            z-index: 5;
            white-space: pre-wrap
        }

        .hd {
            position: absolute;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #5aa9ff;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font: bold 15px Arial;
            z-index: 9;
            touch-action: none
        }

        .hd.x {
            top: -14px;
            right: -14px;
            background: #ff4d4d;
            color: #fff;
            cursor: pointer
        }

        .hd.r {
            bottom: -14px;
            right: -14px;
            cursor: nwse-resize
        }

        #pv {
            position: fixed;
            inset: 0;
            background: #0b0b10;
            z-index: 16000;
            display: none;
            align-items: center;
            justify-content: center
        }

        #pv.on {
            display: flex
        }

        #pvw {
            position: relative;
            overflow: hidden
        }

        #cover {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0b10
        }

        #pvx {
            position: absolute;
            top: 10px;
            right: 12px;
            z-index: 3;
            opacity: .7
        }

        .view .it video,
        .view .it audio {
            pointer-events: auto
        }

        #fx {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 17000
        }

        #md {
            position: fixed;
            inset: 0;
            background: #000b;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 20000;
            padding: 14px
        }

        #md.on {
            display: flex
        }

        #md .box {
            background: #1b1b27;
            border: 1px solid #ffffff33;
            border-radius: 16px;
            padding: 18px;
            width: min(560px, 100%);
            max-height: 92vh;
            overflow: auto
        }

        #md h3 {
            margin: 0 0 12px;
            font-weight: normal;
            font-size: 1.3rem
        }

        #md .acts {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 14px
        }

        #md input:not([type=color]):not([type=range]),
        #md textarea {
            width: 100%;
            background: #0f0f16;
            color: #fff;
            border: 1px solid #ffffff40;
            border-radius: 8px;
            padding: 10px;
            font: 16px Georgia, serif;
            margin-bottom: 8px
        }

        #md a {
            color: #5aa9ff;
            word-break: break-all
        }

        #md p {
            color: #bbb;
            font-size: 14px
        }

        .eg {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            gap: 2px
        }

        .eg button {
            background: none;
            border: 0;
            font-size: 26px;
            padding: 4px;
            border-radius: 8px
        }

        .eg button:hover {
            background: #ffffff22
        }

        #md h4 {
            margin: 10px 0 4px;
            color: #9a9aa5;
            font-weight: normal;
            font-size: 13px
        }

        #cv {
            width: 100%;
            background: #0f0f16;
            border: 1px solid #ffffff40;
            border-radius: 10px;
            touch-action: none;
            cursor: crosshair;
            display: block
        }

        .dtools {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 8px
        }

        .dtools input[type=color] {
            width: 42px;
            height: 36px;
            padding: 0;
            border: 0;
            background: none
        }

        .dtools input[type=range] {
            width: 120px
        }

        .gt {
            position: absolute;
            top: 12px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 99999;
            pointer-events: none;
            padding: 0 20px;
            line-height: 1.2;
            text-shadow: 0 2px 12px #0009
        }

        .fr {
            position: absolute;
            inset: 0;
            z-index: 99998;
            pointer-events: none;
            box-sizing: border-box
        }

        .lb {
            color: #9a9aa5;
            font-size: 14px
        }

        .bar input[type=color] {
            width: 38px;
            height: 34px;
            padding: 0;
            border: 0;
            background: none;
            cursor: pointer
        }

        .b.act {
            border-color: #5aa9ff;
            background: #26375a
        }

        .view .it[data-t] {
            display: none
        }

        .gbox {
            position: relative;
            width: 110px;
            height: 110px;
            cursor: pointer
        }

        .gbox .bx {
            position: absolute;
            left: 5px;
            bottom: 0;
            width: 100px;
            height: 68px;
            background: #ff5e7e;
            border-radius: 6px
        }

        .gbox .bx:after,
        .gbox .lid:after {
            content: "";
            position: absolute;
            left: 44px;
            top: 0;
            width: 12px;
            height: 100%;
            background: #ffd23f
        }

        .gbox .lid {
            position: absolute;
            left: 0;
            bottom: 62px;
            width: 110px;
            height: 26px;
            background: #ff7a93;
            border-radius: 6px;
            transition: transform .7s cubic-bezier(.3, 1.6, .5, 1), opacity .7s .2s;
            transform-origin: left bottom
        }

        .gbox .lid:after {
            left: 49px
        }

        .gbox.open .lid {
            transform: translate(40px, -70px) rotate(28deg);
            opacity: 0
        }

        .gbox.open .bx {
            background: #e63a5e
        }

        .cake {
            position: relative;
            width: 150px;
            height: 150px
        }

        .cake i {
            position: absolute;
            display: block
        }

        .cake .l1 {
            left: 0;
            bottom: 0;
            width: 150px;
            height: 46px;
            background: #c77dff;
            border-radius: 8px
        }

        .cake .l2 {
            left: 18px;
            bottom: 46px;
            width: 114px;
            height: 40px;
            background: #ff8fb1;
            border-radius: 8px
        }

        .cake .cn {
            bottom: 86px;
            width: 7px;
            height: 28px;
            background: linear-gradient(#ffe29a, #ffd23f);
            border-radius: 2px
        }

        .cake .cn:after {
            content: "";
            position: absolute;
            left: -2px;
            top: -16px;
            width: 11px;
            height: 17px;
            background: radial-gradient(#fff 0 20%, #ffb703 55%, #ff5e00);
            border-radius: 50% 50% 50% 50%/65% 65% 35% 35%;
            transform-origin: 50% 100%;
            animation: flk .4s infinite alternate
        }

        .cake.v {
            width: 190px;
            height: 70px
        }

        .cake.v .l1,
        .cake.v .l2 {
            display: none
        }

        .cake.v .cn {
            bottom: 0;
            height: 36px
        }

        .cake.go {
            animation: cin .9s cubic-bezier(.2, .9, .3, 1.2) backwards
        }

        .cake.go .cn:after {
            animation: fl .4s calc(.9s + var(--d)) backwards, flk .4s calc(1.3s + var(--d)) infinite alternate
        }

        .cake.v.go {
            animation: none
        }

        .cake.v.go .cn:after {
            animation: fl .5s var(--d) backwards, flk .4s calc(.5s + var(--d)) infinite alternate
        }

        @keyframes cin {
            from {
                transform: translateY(-140px) scale(.3);
                opacity: 0
            }

            60% {
                transform: translateY(8px) scale(1.05);
                opacity: 1
            }

            to {
                transform: none
            }
        }

        @keyframes fl {
            from {
                transform: scale(0)
            }
        }

        @keyframes flk {
            to {
                transform: scale(.88, 1.12) rotate(4deg)
            }
        }

        /* Íconos dibujados con CSS (máscaras vectoriales) */

            display: inline-block;
            width: 22px;
            height: 22px;
            flex: none;
            background: currentColor;
            -webkit-mask: var(--m) center/contain no-repeat;
            mask: var(--m) center/contain no-repeat
        }

        /* ==========================================
   PICHISOFT - ESTADO DE SESIÓN
   (movido arriba a la izquierda del link "Pichisoft")
   ========================================== */
        #pichisoft-session-status {
            position: fixed;
            top: 12px;
            right: 110px;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: calc(100vw - 20px);
            box-sizing: border-box;
            padding: 8px 16px;
            background: #000;
            color: #20a84b;
            border: 1px solid rgba(34, 197, 94, .25);
            border-radius: 22px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .25);
            font: 14px/1.3 Georgia, serif;
            text-align: left;
            opacity: 1;
            transform: translateY(0);
            transition: opacity .6s ease, transform .6s ease;
            pointer-events: none
        }

        #pichisoft-session-status.hidden {
            opacity: 0;
            transform: translateY(-12px)
        }

        #pichisoft-session-status.success {
            font-weight: bold
        }

        #pichisoft-session-status .ps-check {
            display: none;
            font-size: 20px;
            font-weight: bold;

        (function () {
            /* Todo va dentro de esta función para no chocar con las variables de la app */
            var CFG = {
                apiKey: "AIzaSyCf_P8qp9nBUnsVe3qsTAtZJjZHOktKf-8",

            var V = "https://www.gstatic.com/firebasejs/12.3.0/";
            var DUR_INICIO = 12000;   // "Iniciando sesión..."
            var DUR_MENSAJE = 6000;   // "Sesión iniciada" / avisos

            var box = document.getElementById("pichisoft-session-status");
            var txt = box.querySelector(".ps-text");
            var prof = document.getElementById("pichisoft-session-profile");
            var pic = document.getElementById("pichisoft-profile-picture");
            var nameEl = document.getElementById("pichisoft-profile-name");
            var t0 = Date.now();

            function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

            /* Espera a que Firebase confirme si hay sesión y lee el perfil.
               Si algo falla (sin internet, permisos, etc.) devuelve {error:true} en vez de quedarse trabado. */
            async function comprobar() {
                try {
                    var m = await Promise.all([
                        import(V + "firebase-app.js"),
                        import(V + "firebase-auth.js"),
                        import(V + "firebase-firestore.js")
                    ]);
                    var app = m[0].initializeApp(CFG);
                    var auth = m[1].getAuth(app);
                    var db = m[2].getFirestore(app);

                    var user = await Promise.race([
                        new Promise(function (res) {
                            m[1].onAuthStateChanged(auth, function (u) {
                                window.PichisoftFirebase = { auth: auth, db: db, currentUser: u };
                                res(u);
                            });
                        }),
                        wait(15000).then(function () { throw new Error("tiempo agotado"); })
                    ]);

                    var perfil = {};
                    if (user) {
                        try {
                            var snap = await m[2].getDoc(m[2].doc(db, "users", user.uid));
                            if (snap.exists()) perfil = snap.data();
                        } catch (e) {
                            console.error("Pichisoft: no se pudo leer el perfil", e);
                        }
                    }
                    return { user: user, perfil: perfil };
                } catch (e) {
                    console.error("Pichisoft:", e);
                    return { error: true };
                }
            }

            async function aviso(texto) {
                txt.textContent = texto;
                await wait(DUR_MENSAJE);
                box.classList.add("hidden");
            }

            (async function () {
                var r = await comprobar();
                await wait(Math.max(0, DUR_INICIO - (Date.now() - t0)));

                if (r.error) return aviso("No tienes una sesión iniciada en tu cuenta de Pichisoft");
                if (!r.user) return aviso("No tienes una sesión iniciada en tu cuenta de Pichisoft");

                box.classList.add("success");
                txt.textContent = "Sesión iniciada";
                await wait(DUR_MENSAJE);
                box.classList.add("hidden");

                var nombre = r.perfil.username || "Usuario";
                nameEl.textContent = nombre;
                var foto = r.perfil.photo;

                    var img = new Image();
                    img.src = foto;
                    img.alt = "Foto de perfil";
                    pic.replaceChildren(img);
                } else {
                    var ph = document.createElement("div");
                    ph.className = "profile-placeholder";
                    ph.textContent = nombre.charAt(0).toUpperCase();
                    pic.replaceChildren(ph);
                }
