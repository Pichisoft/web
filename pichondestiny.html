<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>PichonDestiny</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #111, #222);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      overflow: hidden;

      /* Mejoras para la experiencia táctil y de clics */
      user-select: none;
      -webkit-user-select: none;
      cursor: pointer;
      touch-action: manipulation;
    }

    #container {
      padding: 20px;
      /* Aseguramos que el texto no se pueda seleccionar */
      pointer-events: none;
    }

    #respuesta {
      font-size: 28px;
      font-weight: bold;
      transition: opacity 0.3s, transform 0.3s;
    }

    #hint {
      margin-top: 20px;
      font-size: 14px;
      color: #aaa;
    }

    /* ── HEADER ── */
    .header {
      position: fixed;
      top: 20px;
      left: 25px;
      display: flex;
      align-items: baseline;
      gap: 8px;
      z-index: 100;
      pointer-events: none;
      /* Para que no interfiera con el clic */
    }

    .logo {
      font-family: "Times New Roman", Times, serif;
      font-size: 2.2rem;
      font-weight: bold;
      color: white;
    }

    .byline {
      font-family: Arial, sans-serif;
      font-size: 0.9rem;
      font-style: italic;
      color: #bdbdbd;
    }

    /* ==========================================
       PICHISOFT - ESTADO DE SESIÓN
       ========================================== */

    #pichisoft-session-status {
      position: fixed;
      top: 12px;
      right: 120px;
      z-index: 9999;

      display: flex;
      align-items: center;
      gap: 8px;

      max-width: calc(100vw - 20px);
      box-sizing: border-box;
      padding: 8px 16px;

      background: #000;
      color: #20a84b;

      border: 1px solid rgba(34, 197, 94, 0.25);
      border-radius: 22px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);

      font: 14px/1.3 Georgia, serif;
      text-align: left;

      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.6s ease, transform 0.6s ease;
      pointer-events: none;
    }

    #pichisoft-session-status.hidden {
      opacity: 0;
      transform: translateY(-12px);
    }

    #pichisoft-session-status.success {
      font-weight: bold;
    }

    #pichisoft-session-status .ps-check {
      display: none;
      font-size: 20px;
      font-weight: bold;
      line-height: 1;
    }

    #pichisoft-session-status.success .ps-check {
      display: inline-block;
      animation: pichisoftCheck 0.8s cubic-bezier(.17, .89, .32, 1.49) forwards;
    }

    @keyframes pichisoftCheck {
      0% {
        opacity: 0;
        transform: scale(0.2) rotate(-25deg);
      }

      60% {
        opacity: 1;
        transform: scale(1.25) rotate(8deg);
      }

      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    #pichisoft-session-profile {
      position: fixed;
      top: 12px;
      right: 120px;
      z-index: 9998;

      display: flex;
      align-items: center;
      gap: 8px;

      max-width: calc(100vw - 20px);
      box-sizing: border-box;
      padding: 5px 14px 5px 5px;

      background: #000;
      color: #fff;

      border: 1px solid rgba(34, 197, 94, 0.25);
      border-radius: 25px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);

      font-family: Georgia, serif;
      text-align: left;

      opacity: 0;
      transform: translateY(-12px) scale(0.9);
      transition: opacity 0.7s ease, transform 0.7s cubic-bezier(.17, .89, .32, 1.3);
      pointer-events: none;
    }

    #pichisoft-session-profile.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    #pichisoft-profile-picture img,
    #pichisoft-profile-picture .profile-placeholder {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #pichisoft-profile-picture .profile-placeholder {
      background: #20a84b;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
    }

    #pichisoft-profile-name {
      font-size: 14px;
      font-weight: bold;
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Celular: título más chico para que no choque con el link "Pichisoft" */
    @media (max-width: 600px) {
      .header {
        top: 16px;
        left: 15px;
      }

      .logo {
        font-size: 1.5rem;
      }

      .byline {
        font-size: 0.75rem;
      }

      #pichisoft-session-status,
      #pichisoft-session-profile {
        right: 10px;
      }

      #pichisoft-session-status {
        font-size: 13px;
        padding: 7px 14px;
      }
    }

    /* ===== Pichisoft - cartel de sesión en celular (PichonDestiny) ===== */
    @media (max-width: 600px) {

      #pichisoft-session-status,
      #pichisoft-session-profile {
        position: fixed;
        top: 52px;
        right: 10px;
        left: auto;
        max-width: calc(100vw - 20px);
      }
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="logo">PichonDestiny</div>
    <div class="byline">- By Pichisoft -</div>
  </div>

  <div id="container">
    <div id="respuesta"></div>
  </div>

  <script>
    const respuestas = [
      "SÍ",

      "MMMMMM...",
      "CREO QUE NO... O MEJOR... SÍ. SÍ, DEFINITIVAMENTE",
      "CREO QUE SÍ... O MEJOR... NO. NO, DEFINITIVAMENTE NO",

      "ESCUCHÁ A TU CORAZÓN",
      "DA-AH",
      "HACÉ LO QUE QUIERAS",
      "COMO QUIERAS",
      "NOOOOOOOOOOO",
      "SÍIIIIIII",
      "JAJAJAJA, SÍ",
      "JAJAJAJA, NO",
      "ES EL SACRIFICIO QUE EXIGE LA ISLA",
      "DEPENDE, DE TODO DEPENDE",
      "MAÑANA",
      "PREGUNTAME DE NUEVO EN 40 DIAS",
      "NO TE ANIMÁS",
      "EN SERIO?",
      "SÍ, CLARO...",
      "YA QUISIERA",
      "TODAVÍA NO",
      "PREGUNTALE AL PICHÓN",
      "SIEMPRE",
      "NUNCA",
      "NO SÉ :(",
      "ESTOY NERVIOSO PARA RESPONDER A ESA PREGUNTA",
      "HOLA :D"
    ];

    const el = document.getElementById("respuesta");
    let animationTimer = null; // Guardamos el temporizador para cancelarlo si se toca rápido

    function nuevaRespuesta(e) {
      // Evitar que cambie la respuesta si tocamos el link de Pichisoft, el header o el cartel de sesión
      if (e && e.target.closest('a, .header, #pichisoft-session-status, #pichisoft-session-profile')) {
        return;
      }

      el.style.opacity = 0;
      el.style.transform = "scale(0.9)";

      // Cancelar la animación anterior si el usuario está tocando muy rápido
      if (animationTimer) {
        clearTimeout(animationTimer);
      }

      animationTimer = setTimeout(() => {
        const r = respuestas[Math.floor(Math.random() * respuestas.length)];
        el.textContent = r;

        el.style.opacity = 1;
        el.style.transform = "scale(1)";
        animationTimer = null;
      }, 150);
    }

    /* Al cargar, mostramos la primera */
    nuevaRespuesta();

    /* 
     * Usamos "pointerdown" en lugar de "click" y "touchstart".
     * Esto unifica la experiencia en PC (mouse) y celular (dedo),
     * y soluciona el problema del doble toque.
     */
    document.body.addEventListener("pointerdown", nuevaRespuesta);
  </script>

  <p style="position: fixed; top: 15px; right: 20px; font-weight: bold; margin: 0; z-index: 9999;">
    <a href="https://pichisoft.cc" target="_blank" style="color:#4db8ff; text-decoration: underline;">Pichisoft</a>
  </p>

  <!-- ===== Pichisoft - Estado de sesión ===== -->
  <div id="pichisoft-session-status" role="status" aria-live="polite">
    <span class="ps-check">✓</span>
    <span class="ps-text">Iniciando sesión en tu cuenta de Pichisoft...</span>
  </div>

  <div id="pichisoft-session-profile">
    <div id="pichisoft-profile-picture"></div>
    <span id="pichisoft-profile-name"></span>
  </div>

  <script>
    (function () {
      var CFG = {
        apiKey: "AIzaSyCf_P8qp9nBUnsVe3qsTAtZJjZHOktKf-8",
        authDomain: "pichisoft.firebaseapp.com",
        projectId: "pichisoft",
        storageBucket: "pichisoft.firebasestorage.app",
        messagingSenderId: "690032082295",
        appId: "1:690032082295:web:b7f0e8cb8fcceb26e9b572",
        measurementId: "G-K7HRKR8BJ1"
      };
      var V = "https://www.gstatic.com/firebasejs/12.3.0/";
      var DUR_INICIO = 12000;
      var DUR_MENSAJE = 6000;

      var box = document.getElementById("pichisoft-session-status");
      var txt = box.querySelector(".ps-text");
      var prof = document.getElementById("pichisoft-session-profile");
      var pic = document.getElementById("pichisoft-profile-picture");
      var nameEl = document.getElementById("pichisoft-profile-name");
      var t0 = Date.now();

      function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

      async function comprobar() {
        try {
          var m = await Promise.all([
            import(V + "firebase-app.js"),
            import(V + "firebase-auth.js"),
            import(V + "firebase-firestore.js")
          ]);
          var app = m[0].initializeApp(CFG);
          var auth = m[1].getAuth(app);
          var db = m[2].getFirestore(app);

          var user = await Promise.race([
            new Promise(function (res) {
              m[1].onAuthStateChanged(auth, function (u) {
                window.PichisoftFirebase = { auth: auth, db: db, currentUser: u };
                res(u);
              });
            }),
            wait(15000).then(function () { throw new Error("tiempo agotado"); })
          ]);

          var perfil = {};
          if (user) {
            try {
              var snap = await m[2].getDoc(m[2].doc(db, "users", user.uid));
              if (snap.exists()) perfil = snap.data();
            } catch (e) {
              console.error("Pichisoft: no se pudo leer el perfil", e);
            }
          }
          return { user: user, perfil: perfil };
        } catch (e) {
          console.error("Pichisoft:", e);
          return { error: true };
        }
      }

      async function aviso(texto) {
        txt.textContent = texto;
        await wait(DUR_MENSAJE);
        box.classList.add("hidden");
      }

      (async function () {
        var r = await comprobar();
        await wait(Math.max(0, DUR_INICIO - (Date.now() - t0)));

        if (r.error) return aviso("No se pudo comprobar tu sesión de Pichisoft");
        if (!r.user) return aviso("No tenés una sesión iniciada en Pichisoft");

        box.classList.add("success");
        txt.textContent = "Sesión iniciada";
        await wait(DUR_MENSAJE);
        box.classList.add("hidden");

        var nombre = r.perfil.username || "Usuario";
        nameEl.textContent = nombre;
        var foto = r.perfil.photo;
        if (typeof foto === "string" && /^(data:image\/|https:\/\/)/.test(foto)) {
          var img = new Image();
          img.src = foto;
          img.alt = "Foto de perfil";
          pic.replaceChildren(img);
        } else {
          var ph = document.createElement("div");
          ph.className = "profile-placeholder";
          ph.textContent = nombre.charAt(0).toUpperCase();
          pic.replaceChildren(ph);
        }
        await wait(450);
        prof.classList.add("visible");
      })();
    })();
  </script>
  <!-- ============================================================
     PICHISOFT · BOTÓN DE AYUDA (estilo premium)
     Pegar al final del <body> de cada app.
     Cambiar SOLO el objeto CONFIG (titulo, descripcion, top, right).
     ============================================================ -->
<script>
(function () {
    'use strict';

    /* ============================================================
       CONFIGURACIÓN — CAMBIAR POR APP
       ============================================================
       titulo       → título del panel (Times New Roman, dorado)
       descripcion  → contenido. Respeta saltos de línea. Admite:
                      <strong>negrita</strong>, <i>cursiva</i>,
                      <a href="...">link</a>
       top          → distancia desde arriba (ajustar según header)
       right        → distancia desde la derecha (ajustar para quedar
                      a la izquierda de los carteles de sesión y del
                      link Pichisoft)
       ============================================================ */
    const CONFIG = {
        titulo: 'Ayuda para PichonDestiny',
        descripcion: `PichonDestiny es una app a la que le puedes hacer preguntas cerradas (por ejemplo, "¿Mañana visitaré mi lugar favorito?"), tocas la pantalla y te dirá una respuesta.
Puede sugerir mejoras para esta app <a href="https://mail.google.com/mail/?view=cm&fs=1&to=contacto@pichisoft.cc" target="_blank"
                rel="noopener">aquí</a>.`,
        top: '86px',
        right: '40px'
    };
    /* ============================================================ */

    // Evitar duplicados si se carga dos veces
    if (document.getElementById('psHelpBtn')) return;

    // ─── CSS ───
    const css = document.createElement('style');
    css.textContent = `
/* Botón flotante */
#psHelpBtn {
    position: fixed;
    top: ${CONFIG.top};
    right: ${CONFIG.right};
    z-index: 9998;
    width: 38px;
    height: 38px;
    padding: 0;
    border-radius: 50%;
    border: 2px solid #d4af37;
    background: linear-gradient(135deg, #2b2107, #100c02);
    color: #f1d98a;
    font: bold 20px/1 "Times New Roman", Times, serif;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 14px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.1);
    transition: transform .25s, background .25s, color .25s, box-shadow .25s;
}
#psHelpBtn:hover {
    background: linear-gradient(135deg, #d4af37, #a67c12);
    color: #111;
    transform: scale(1.08);
    box-shadow: 0 6px 20px rgba(212,175,55,.45);
}
#psHelpBtn:focus-visible {
    outline: 2px solid #f1d98a;
    outline-offset: 2px;
}

/* Overlay */
#psHelpOv {
    position: fixed;
    inset: 0;
    z-index: 10000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
    box-sizing: border-box;
    overflow: auto;
    background: rgba(0,0,0,.72);
    backdrop-filter: blur(0);
    -webkit-backdrop-filter: blur(0);
    opacity: 0;
    transition: opacity .35s ease, backdrop-filter .35s ease;
}
#psHelpOv.on {
    opacity: 1;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
}

/* Card */
#psHelpCard {
    position: relative;
    width: min(560px, 100%);
    margin: auto;
    box-sizing: border-box;
    padding: 22px 24px 20px;
    color: #fff;
    background: linear-gradient(180deg, #181818, #0b0b0b);
    border: 2px solid #d4af37;
    border-radius: 16px;
    box-shadow: 0 0 0 1px rgba(212,175,55,.18), 0 30px 80px rgba(0,0,0,.85), 0 0 44px rgba(212,175,55,.12);
    opacity: 0;
    transform: translateY(24px) scale(.95);
    transition: opacity .4s ease, transform .5s cubic-bezier(.2,.9,.25,1.08);
}
#psHelpOv.on #psHelpCard {
    opacity: 1;
    transform: none;
}

/* Título */
#psHelpCard h2 {
    margin: 0 40px 14px 0;
    font: bold 1.7rem "Times New Roman", Times, serif;
    color: #fff;
    line-height: 1.2;
}

/* Contenido */
#psHelpBody {
    font: bold .95rem/1.7 Verdana, "Open Sans", sans-serif;
    color: #fff;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 60vh;
    overflow-y: auto;
    padding-right: 4px;
}
#psHelpBody a,
#psHelpBody a:visited {
    color: #4da3ff;
    text-decoration: underline;
    font-weight: bold;
}
#psHelpBody a:hover { color: #8cc4ff; }
#psHelpBody i { font-style: italic; font-weight: bold; }
#psHelpBody strong { font-weight: bold; color: #fff; }

/* Botón X (CSS puro) */
#psHelpX {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 30px;
    height: 30px;
    padding: 0;
    border: 1.5px solid #d4af37;
    border-radius: 50%;
    background: none;
    cursor: pointer;
    transition: transform .3s, background .2s;
}
#psHelpX::before,
#psHelpX::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 12px;
    height: 2px;
    margin: -1px 0 0 -6px;
    border-radius: 2px;
    background: #f1d98a;
    transition: background .2s;
}
#psHelpX::before { transform: rotate(45deg); }
#psHelpX::after { transform: rotate(-45deg); }
#psHelpX:hover {
    transform: rotate(90deg);
    background: #d4af37;
}
#psHelpX:hover::before,
#psHelpX:hover::after { background: #111; }
#psHelpX:focus-visible {
    outline: 2px solid #f1d98a;
    outline-offset: 2px;
}

/* Botón Entendido */
#psHelpClose {
    display: block;
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #f1d98a;
    cursor: pointer;
    color: #fff;
    font: bold 1rem Georgia, "Times New Roman", serif;
    background: linear-gradient(135deg, #2b2107, #100c02);
    transition: background .3s, color .2s, transform .2s;
}
#psHelpClose:hover {
    background: linear-gradient(135deg, #d4af37, #a67c12);
    color: #111;
    transform: translateY(-2px);
}

/* Responsive */
@media (max-width: 600px) {
    #psHelpBtn {
        top: ${CONFIG.top};
        right: ${CONFIG.right};
        width: 34px;
        height: 34px;
        font-size: 18px;
    }
    #psHelpCard { padding: 18px 16px 16px; }
    #psHelpCard h2 { font-size: 1.4rem; margin-right: 36px; }
}
@media (prefers-reduced-motion: reduce) {
    #psHelpBtn, #psHelpOv, #psHelpCard, #psHelpX, #psHelpClose { transition: none !important; animation: none !important; }
}
`;
    document.head.appendChild(css);

    // ─── Botón flotante ───
    const btn = document.createElement('button');
    btn.id = 'psHelpBtn';
    btn.type = 'button';
    btn.setAttribute('aria-label', 'Ayuda');
    btn.title = 'Ayuda';
    btn.textContent = '?';
    document.body.appendChild(btn);

    // ─── Lógica ───
    let ov = null;
    let onEsc = null;

    function abrir() {
        if (ov) return;

        ov = document.createElement('div');
        ov.id = 'psHelpOv';
        ov.setAttribute('role', 'dialog');
        ov.setAttribute('aria-modal', 'true');
        ov.setAttribute('aria-labelledby', 'psHelpTitle');
        ov.innerHTML = `
            <div id="psHelpCard">
                <button id="psHelpX" type="button" aria-label="Cerrar ayuda" title="Cerrar"></button>
                <h2 id="psHelpTitle"></h2>
                <div id="psHelpBody"></div>
                <button id="psHelpClose" type="button">Entendido</button>
            </div>
        `;
        // Título (texto plano, seguro) y cuerpo (HTML configurado por el dueño de la app)
        ov.querySelector('#psHelpTitle').textContent = CONFIG.titulo;
        ov.querySelector('#psHelpBody').innerHTML = CONFIG.descripcion;
        document.body.appendChild(ov);

        // Forzar reflow para que la animación funcione
        void ov.offsetHeight;
        requestAnimationFrame(() => requestAnimationFrame(() => ov.classList.add('on')));

        // Bloquear scroll de fondo
        document.documentElement.style.overflow = 'hidden';

        // Eventos
        ov.querySelector('#psHelpX').onclick = cerrar;
        ov.querySelector('#psHelpClose').onclick = cerrar;
        ov.addEventListener('click', e => { if (e.target === ov) cerrar(); });

        onEsc = e => { if (e.key === 'Escape') cerrar(); };
        document.addEventListener('keydown', onEsc);

        // Foco al botón de cerrar
        setTimeout(() => { try { ov.querySelector('#psHelpX').focus(); } catch { } }, 300);
    }

    function cerrar() {
        if (!ov) return;
        const el = ov;
        ov = null;
        el.classList.remove('on');
        if (onEsc) { document.removeEventListener('keydown', onEsc); onEsc = null; }
        document.documentElement.style.overflow = '';
        setTimeout(() => el.remove(), 400);
    }

    btn.onclick = abrir;

    // API pública por si querés abrirlo desde código
    window.PichisoftAyuda = { abrir, cerrar };
})();
</script>
</body>

</html>
