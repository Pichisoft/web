<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PichonOpinion</title>
    <style>
        :root {
            --bg: #f4f8ff;
            --card: #fff;
            --bd: #d6e2f5;
            --blue: #1a56db;
            --tx: #14213d;
            --mut: #6b7a90;
            --title: #000;
            --star: #f5b301;
            --off: #cbd5e1
        }

        :root[data-theme=dark] {
            --bg: #0e1525;
            --card: #17203a;
            --bd: #263456;
            --blue: #4c8dff;
            --tx: #e6ecfa;
            --mut: #93a1bd;
            --title: #fff;
            --off: #35435f
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--tx);
            font: 15px/1.45 system-ui, Segoe UI, Arial, sans-serif
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 16px 22px;
            gap: 12px;
            flex-wrap: wrap
        }

        .ttl {
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap
        }

        .ttl h1 {
            margin: 0;
            font: 700 34px "Times New Roman", Times, serif;
            color: var(--title)
        }

        .ttl span {
            font-style: italic;
            color: #888;
            font-size: 13px
        }

        .right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px
        }

        .right a {
            color: #0645ad;
            font-family: Verdana, sans-serif;
            text-decoration: underline
        }

        :root[data-theme=dark] .right a {
            color: #6ea8ff
        }

        .tools {
            display: flex;
            gap: 8px;
            align-items: center
        }

        .ib {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--blue);
            background: transparent;
            cursor: pointer;
            position: relative;
            padding: 0
        }

        .ib.i::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 13px;
            width: 3px;
            height: 10px;
            margin-left: -1.5px;
            background: var(--blue);
            border-radius: 1px
        }

        .ib.i::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 6px;
            width: 4px;
            height: 4px;
            margin-left: -2px;
            background: var(--blue);
            border-radius: 50%
        }

        .ib.t::before {
            content: "";
            position: absolute;
            left: 8px;
            top: 8px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            box-shadow: inset -4px -2px 0 0 var(--blue)
        }

        :root[data-theme=dark] .ib.t::before {
            box-shadow: none;
            background: var(--blue);
            width: 8px;
            height: 8px;
            left: 10px;
            top: 10px
        }

        .btn {
            background: var(--blue);
            color: #fff;
            border: 0;
            border-radius: 8px;
            padding: 8px 14px;
            font: 600 14px inherit;
            font-family: inherit;
            cursor: pointer
        }

        .btn:hover {
            filter: brightness(1.1)
        }

        .btn:disabled {
            opacity: .5
        }

        .btn.ghost {
            background: transparent;
            color: var(--blue);
            border: 1px solid var(--blue)
        }

        .nav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding: 0 22px 8px
        }

        .nav button {
            background: var(--card);
            color: var(--tx);
            border: 1px solid var(--bd);
            border-radius: 20px;
            padding: 7px 15px;
            cursor: pointer;
            font: inherit
        }

        .nav button.on {
            background: var(--blue);
            color: #fff;
            border-color: var(--blue)
        }

        .bar {
            padding: 6px 22px
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 18px;
            padding: 12px 22px 30px
        }

        .card {
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column
        }

        .card img {
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: cover;
            background: var(--bd)
        }

        .card .b {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1
        }

        .card h3 {
            margin: 0;
            font-size: 18px
        }

        .card p {
            margin: 0;
            color: var(--mut);
            font-size: 13px;
            flex: 1
        }

        .tag {
            align-self: flex-start;
            background: var(--bg);
            color: var(--blue);
            border: 1px solid var(--bd);
            border-radius: 10px;
            padding: 1px 9px;
            font-size: 12px;
            font-weight: 600
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center
        }

        .empty {
            color: var(--mut);
            padding: 20px
        }

        footer {
            padding: 16px 22px;
            color: var(--mut);
            font-size: 12px;
            text-align: center
        }

        .ov {
            position: fixed;
            inset: 0;
            background: rgba(10, 20, 40, .55);
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 4vh 12px;
            overflow: auto;
            z-index: 50
        }

        .hide {
            display: none !important
        }

        .md {
            background: var(--card);
            border-radius: 14px;
            width: 100%;
            max-width: 640px;
            padding: 18px;
            border: 1px solid var(--bd)
        }

        .mh {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px
        }

        .mh h2 {
            margin: 0;
            font-size: 20px
        }

        .x {
            background: none;
            border: 0;
            font-size: 26px;
            color: var(--mut);
            cursor: pointer;
            line-height: 1
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 9px;
            border: 1px solid var(--bd);
            border-radius: 8px;
            background: var(--bg);
            color: var(--tx);
            font: inherit;
            margin: 4px 0 10px
        }

        textarea {
            min-height: 80px;
            resize: vertical
        }

        label {
            font-size: 13px;
            color: var(--mut)
        }

        .pv {
            max-width: 160px;
            border-radius: 8px;
            display: block;
            margin: 6px 0
        }

        .st {
            display: inline-block;
            width: 18px;
            height: 18px;
            background: var(--off);
            clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            margin-right: 2px;
            vertical-align: middle
        }

        .st.on {
            background: var(--star)
        }

        .cmp .st {
            width: 28px;
            height: 28px;
            cursor: pointer
        }

        .cmp {
            border: 1px solid var(--blue);
            border-radius: 10px;
            padding: 12px;
            margin: 10px 0
        }

        .rv {
            display: flex;
            gap: 10px;
            padding: 12px 0;
            border-top: 1px solid var(--bd)
        }

        .rv.rp {
            margin-left: 42px
        }

        .av {
            flex: 0 0 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--blue);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            overflow: hidden
        }

        .av img {
            width: 100%;
            height: 100%;
            object-fit: cover
        }

        .rb {
            flex: 1;
            min-width: 0
        }

        .rb p {
            margin: 4px 0;
            word-wrap: break-word
        }

        .rn {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap
        }

        .pre {
            color: var(--blue)
        }

        .ed {
            color: var(--mut);
            font-size: 12px
        }

        .sm {
            font-size: 13px
        }

        .lk,
        .lnk {
            background: none;
            border: 0;
            color: var(--mut);
            cursor: pointer;
            font: inherit;
            padding: 2px 4px;
            display: flex;
            align-items: center;
            gap: 5px
        }

        .lk.on {
            color: #e0245e
        }

        .lnk:hover,
        .lk:hover {
            color: var(--blue)
        }

        .heart {
            display: inline-block;
            width: 24px;
            height: 24px;
            background: currentColor;
            clip-path: path('M12 21s-8-5.5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.5-8 11-8 11z');
            transform: scale(.62);
            margin: -5px
        }

        #toasts {
            position: fixed;
            top: 14px;
            right: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 99
        }

        .toast {
            background: var(--card);
            border: 1px solid var(--bd);
            border-left: 5px solid var(--blue);
            padding: 10px 16px;
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, .2);
            max-width: 300px
        }

        .toast.err {
            border-left-color: #d62839
        }

        .toast.ok {
            border-left-color: #1f9d55
        }

        .info p {
            margin: 8px 0
        }
    </style>
</head>

<body>
    <header>
        <div class="ttl">
            <h1>PichonOpinion</h1><span>- By Pichisoft -</span>
        </div>
        <div class="right">
            <a href="https://pichisoft.cc" target="_blank" rel="noopener">Pichisoft</a>
            <div class="tools"><span id="acc"></span><button class="ib t" id="th" title="Cambiar tema"></button><button
                    class="ib i" id="inf" title="Información"></button></div>
        </div>
    </header>
    <div class="nav" id="nav"></div>
    <div class="bar"><button class="btn hide" id="add">+Añadir</button></div>
    <div id="grid"></div>
    <footer>Las portadas e imágenes pertenecen a sus respectivos titulares y se muestran con fines de reseña y crítica.
    </footer>
    <div class="ov hide" id="ov">
        <div class="md" id="md"></div>
    </div>
    <div id="toasts"></div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script>
        // ====== COMPLETÁ con la config de tu proyecto Firebase (el mismo de Pichisoft) ======
        const CFG = { apiKey: "AIzaSyCf_P8qp9nBUnsVe3qsTAtZJjZHOktKf-8", authDomain: "pichisoft.firebaseapp.com", projectId: "pichisoft", appId: "1:690032082295:web:b7f0e8cb8fcceb26e9b5721" };
        firebase.initializeApp(CFG);
        const auth = firebase.auth(), db = firebase.firestore(), FV = firebase.firestore.FieldValue;
        const ADMINS = ['XIY1FfjUDodaSBSGema6NgixKRs1', 'n0XOUeFku1SxKWbrPWsA0V86kfc2'];
        const CATS = ['Películas y series', 'Libros', 'Juegos', 'Videojuegos', 'Otros'];
        const $ = s => document.querySelector(s);
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const isAd = u => !!u && ADMINS.includes(u);
        let me = null, cat = null, posts = [], av = {}, cnt = {}, unsubR = null, cur = null, revs = [], cmp = null, newImg = '';

        function toast(m, t) { const d = document.createElement('div'); d.className = 'toast ' + (t || ''); d.textContent = m; $('#toasts').appendChild(d); setTimeout(() => d.remove(), 3800) }
        function ask(msg) { return new Promise(r => { const o = document.createElement('div'); o.className = 'ov'; o.style.zIndex = 80; o.innerHTML = `<div class="md" style="max-width:360px"><p>${esc(msg)}</p><div class="row"><button class="btn" id="y">Aceptar</button><button class="btn ghost" id="n">Cancelar</button></div></div>`; document.body.appendChild(o); o.querySelector('#y').onclick = () => { o.remove(); r(true) }; o.querySelector('#n').onclick = () => { o.remove(); r(false) } }) }
        function openM(h) { $('#md').innerHTML = h; $('#ov').classList.remove('hide') }
        function closeM() { $('#ov').classList.add('hide'); if (unsubR) { unsubR(); unsubR = null } cur = null; cmp = null }
        $('#ov').addEventListener('mousedown', e => { if (e.target.id === 'ov') closeM() });

        // Tema
        function setTheme(t) { document.documentElement.dataset.theme = t; try { localStorage.setItem('po_t', t) } catch (e) { } }
        let t0 = null; try { t0 = localStorage.getItem('po_t') } catch (e) { }
        setTheme(t0 || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light'));
        $('#th').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

        // Navegación
        $('#nav').innerHTML = CATS.map(c => `<button data-c="${c}">${c}</button>`).join('');
        $('#nav').onclick = e => { const c = e.target.dataset.c; if (!c) return; cat = cat === c ? null : c;[...$('#nav').children].forEach(b => b.classList.toggle('on', b.dataset.c === cat)); renderPosts() };

        function renderPosts() {
            const l = posts.filter(p => !cat || p.type === cat);
            $('#grid').innerHTML = l.length ? l.map(p => `<article class="card"><img src="${/^data:image\//.test(p.img) ? p.img : ''}" alt=""><div class="b"><span class="tag">${esc(p.type)}</span><h3>${esc(p.title)}</h3><p>${esc(p.sub)}</p><div class="row"><button class="btn" data-a="rev" data-id="${p.id}">Dejar reseña</button><button class="btn ghost" data-a="view" data-id="${p.id}">Ver opiniones</button>${isAd(me?.uid) ? `<button class="btn ghost" data-a="delp" data-id="${p.id}">Eliminar</button>` : ''}</div></div></article>`).join('') : '<p class="empty">Todavía no hay publicaciones.</p>';
        }
        db.collection('po_posts').orderBy('ts', 'desc').onSnapshot(s => { posts = s.docs.map(d => ({ id: d.id, ...d.data() })); renderPosts() }, () => toast('No se pudieron cargar las publicaciones', 'err'));

        // Cuenta
        function drawTop() {
            $('#acc').innerHTML = me ? `<span style="font-size:13px">${esc(me.displayName || me.email)}</span> <button class="btn ghost" data-a="out">Salir</button>` : `<button class="btn" data-a="login">Ingresar</button>`;
            $('#add').classList.toggle('hide', !isAd(me?.uid));
        }
        auth.onAuthStateChanged(u => {
            if (u && !u.emailVerified) { toast('Verificá tu email para participar', 'err'); me = null } else me = u;
            drawTop(); renderPosts(); if (cur) drawRevs();
        });
        function loginM() { openM(`<div class="mh"><h2>Ingresar</h2><button class="x" data-a="close">×</button></div><label>Email</label><input id="em" type="email"><label>Contraseña</label><input id="pw" type="password"><div class="row"><button class="btn" data-a="dologin">Ingresar</button><a href="https://pichisoft.cc" target="_blank" rel="noopener" style="color:var(--blue)">Crear cuenta en Pichisoft</a></div>`) }
        async function doLogin() { try { await auth.signInWithEmailAndPassword($('#em').value.trim(), $('#pw').value); closeM(); toast('Sesión iniciada', 'ok') } catch (e) { toast('Email o contraseña incorrectos', 'err') } }

        function infoM() { openM(`<div class="mh"><h2>Sobre PichonOpinion</h2><button class="x" data-a="close">×</button></div><div class="info"><p>PichonOpinion es una app de Pichisoft donde se publican películas, series, libros, juegos y videojuegos para que la comunidad los califique de 1 a 5 estrellas y deje su opinión.</p><p>Cualquiera puede leer las reseñas. Para opinar, dar like o responder necesitás una cuenta de Pichisoft con el email verificado; tu reseña se muestra con tu usuario y tu foto de perfil. Podés editar y eliminar tus propios comentarios.</p><p><b>·Admin</b>: quienes administran la app. Pueden publicar, comentar y también editar o eliminar cualquier comentario.</p><p><b>·Experto</b>: usuarios que llegaron a 120 opiniones (reseñas publicadas, sin contar respuestas).</p></div>`) }

        // Añadir publicación (admin)
        function addM() {
            newImg = ''; openM(`<div class="mh"><h2>Nueva publicación</h2><button class="x" data-a="close">×</button></div><label>Foto</label><input type="file" id="pf" accept="image/*"><img id="pp" class="pv hide"><label>Título</label><input id="pt" maxlength="120"><label>Subtítulo</label><input id="ps" maxlength="300" style="font-size:13px;color:var(--mut)"><label>Tipo</label><select id="pk">${CATS.map(c => `<option>${c}</option>`).join('')}</select><button class="btn" data-a="pub">Publicar</button>`);
            $('#pf').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { const i = new Image(); i.onload = () => { const k = Math.min(1, 600 / i.width), c = document.createElement('canvas'); c.width = i.width * k; c.height = i.height * k; c.getContext('2d').drawImage(i, 0, 0, c.width, c.height); newImg = c.toDataURL('image/jpeg', .8); $('#pp').src = newImg; $('#pp').classList.remove('hide') }; i.src = r.result }; r.readAsDataURL(f) };
        }
        async function publish() {
            const title = $('#pt').value.trim(), sub = $('#ps').value.trim();
            if (!newImg || !title) return toast('Falta la foto o el título', 'err');
            try { await db.collection('po_posts').add({ img: newImg, title, sub, type: $('#pk').value, uid: me.uid, ts: FV.serverTimestamp() }); closeM(); toast('Publicado', 'ok') } catch (e) { toast('No se pudo publicar', 'err') }
        }

        // Reseñas
        const stars = n => [1, 2, 3, 4, 5].map(i => `<span class="st ${i <= n ? 'on' : ''}"></span>`).join('');
        function openPost(id, c) {
            const p = posts.find(x => x.id == id); if (!p) return; cur = p; cmp = null;
            openM(`<div class="mh"><h2>${esc(p.title)}</h2><button class="x" data-a="close">×</button></div><div id="sum"></div><div id="cmp"></div><div id="list"></div>`);
            unsubR = db.collection('po_reviews').where('post', '==', id).onSnapshot(s => { revs = s.docs.map(d => ({ id: d.id, ...d.data() })); loadMeta(); drawRevs() }, () => toast('No se pudieron cargar las opiniones', 'err'));
            if (c) setTimeout(() => startCmp('new'), 0);
        }
        function loadMeta() {
            [...new Set(revs.map(r => r.uid))].forEach(u => {
                if (!(u in av)) { av[u] = null; db.collection('po_avatars').doc(u).get().then(d => { av[u] = d.exists ? d.data() : { n: 'Usuario' }; drawRevs() }).catch(() => { av[u] = { n: 'Usuario' } }) }
                if (!(u in cnt)) { cnt[u] = 0; countOf(u) }
            });
        }
        async function countOf(u) {
            try {
                const q = db.collection('po_reviews').where('uid', '==', u).where('parent', '==', ''); let n;
                try { n = (await q.count().get()).data().count } catch (e) { n = (await q.get()).size }
                cnt[u] = n; drawRevs()
            } catch (e) { }
        }
        const tms = r => r.ts?.toMillis?.() || Date.now();
        function item(r, rep) {
            const a = av[r.uid] || {}, lk = Object.keys(r.likes || {}), liked = me && lk.includes(me.uid), can = me && (me.uid === r.uid || isAd(me.uid));
            const pre = isAd(r.uid) ? '·Admin' : (cnt[r.uid] >= 120 ? '·Experto' : '');
            return `<div class="rv ${rep ? 'rp' : ''}"><div class="av">${a.photo ? `<img src="${esc(a.photo)}" alt="">` : esc((a.n || '?')[0])}</div><div class="rb"><div class="rn"><b>${pre ? `<span class="pre">${pre}</span>` : ''}${esc(a.n || '...')}</b>${rep ? '' : stars(r.stars)}</div><p>${esc(r.text)}${r.edited ? ' <i class="ed">(editado)</i>' : ''}</p><div class="row sm"><button class="lk ${liked ? 'on' : ''}" data-a="like" data-id="${r.id}"><i class="heart"></i>${lk.length}</button><button class="lnk" data-a="reply" data-id="${r.id}">Responder</button>${can ? `<button class="lnk" data-a="edit" data-id="${r.id}">Editar</button><button class="lnk" data-a="del" data-id="${r.id}">Eliminar</button>` : ''}</div></div></div>`;
        }
        function drawRevs() {
            if (!cur || !$('#list')) return;
            const roots = revs.filter(r => !r.parent).sort((a, b) => tms(b) - tms(a)), mine = me && roots.find(r => r.uid === me.uid);
            const avg = roots.length ? (roots.reduce((s, r) => s + r.stars, 0) / roots.length) : 0;
            $('#sum').innerHTML = `<div class="row"><span>${stars(Math.round(avg))}</span><b>${avg ? avg.toFixed(1) : '-'}</b><span class="ed">(${roots.length} ${roots.length === 1 ? 'opinión' : 'opiniones'})</span></div><p style="margin:8px 0;color:var(--mut);font-size:13px">${esc(cur.type)} · ${esc(cur.sub)}</p>${me ? `<button class="btn" data-a="new">${mine ? 'Editar mi reseña' : 'Dejar reseña'}</button>` : `<p class="ed">Ingresá con tu cuenta de Pichisoft para dejar tu reseña.</p>`}`;
            $('#list').innerHTML = roots.length ? roots.map(r => item(r, 0) + revs.filter(x => x.parent === r.id).sort((a, b) => tms(a) - tms(b)).map(x => item(x, 1)).join('')).join('') : '<p class="empty">Todavía no hay opiniones.</p>';
        }
        function startCmp(mode, r) {
            if (!me) return toast('Ingresá para participar', 'info');
            const mine = revs.find(x => !x.parent && x.uid === me.uid);
            if (mode === 'new' && mine) { mode = 'edit'; r = mine }
            if (mode === 'reply') cmp = { mode, parent: r.parent || r.id, stars: 0, text: '', who: av[r.uid]?.n || '' };
            else if (mode === 'edit') cmp = { mode, id: r.id, parent: r.parent, stars: r.stars, text: r.text };
            else cmp = { mode, stars: 0, text: '' };
            drawCmp(); $('#md').scrollTop = 0;
        }
        function drawCmp() {
            const c = cmp, rep = c.mode === 'reply' || (c.mode === 'edit' && c.parent);
            $('#cmp').innerHTML = `<div class="cmp"><b>${c.mode === 'reply' ? 'Respondiendo a ' + esc(c.who) : c.mode === 'edit' ? 'Editar' : 'Tu reseña'}</b><div style="margin:8px 0">${rep ? '' : [1, 2, 3, 4, 5].map(i => `<span class="st ${i <= c.stars ? 'on' : ''}" data-a="star" data-s="${i}"></span>`).join('')}</div><textarea id="ct" maxlength="800" placeholder="Escribí tu opinión...">${esc(c.text)}</textarea><div class="row"><button class="btn" data-a="send">Publicar</button><button class="btn ghost" data-a="cc">Cancelar</button></div></div>`;
        }
        function small(src) { return new Promise(r => { const i = new Image(); i.onload = () => { const c = document.createElement('canvas'); c.width = c.height = 64; const m = Math.min(i.width, i.height); c.getContext('2d').drawImage(i, (i.width - m) / 2, (i.height - m) / 2, m, m, 0, 0, 64, 64); r(c.toDataURL('image/jpeg', .7)) }; i.onerror = () => r(''); i.src = src }) }
        async function ensureAv() {
            if (av[me.uid]?.ok) return;
            const d = await db.collection('public_profiles').doc(me.uid).get();
            if (!d.exists) throw new Error('perfil');
            const { username, photo } = d.data(), ph = photo ? await small(photo) : '';
            await db.collection('po_avatars').doc(me.uid).set({ n: username, photo: ph });
            av[me.uid] = { n: username, photo: ph, ok: 1 };
        }
        async function send() {
            const text = $('#ct').value.trim(), c = cmp, rep = c.mode === 'reply' || (c.mode === 'edit' && c.parent);
            if (!text) return toast('Escribí algo primero', 'err');
            if (!rep && !c.stars) return toast('Elegí de 1 a 5 estrellas', 'err');
            try {
                await ensureAv(); const col = db.collection('po_reviews');
                if (c.mode === 'edit') await col.doc(c.id).update(rep ? { text, edited: true } : { text, stars: c.stars, edited: true });
                else if (c.mode === 'reply') await col.add({ post: cur.id, uid: me.uid, stars: 0, text, ts: FV.serverTimestamp(), likes: {}, parent: c.parent });
                else { await col.doc(cur.id + '_' + me.uid).set({ post: cur.id, uid: me.uid, stars: c.stars, text, ts: FV.serverTimestamp(), likes: {}, parent: '' }); cnt[me.uid] = (cnt[me.uid] || 0) + 1; countOf(me.uid) }
                cmp = null; $('#cmp').innerHTML = ''; toast('Listo', 'ok');
            } catch (e) { toast(e.message === 'perfil' ? 'Primero completá tu perfil en Pichisoft' : 'No se pudo guardar', 'err') }
        }
        async function like(id) {
            if (!me) return toast('Ingresá para dar like', 'info');
            const r = revs.find(x => x.id == id), on = r.likes?.[me.uid];
            try { await db.collection('po_reviews').doc(id).update({ ['likes.' + me.uid]: on ? FV.delete() : true }) } catch (e) { toast('No se pudo', 'err') }
        }
        async function delRev(id) {
            if (!await ask('¿Eliminar este comentario?')) return;
            try {
                const b = db.batch(); b.delete(db.collection('po_reviews').doc(id));
                if (isAd(me.uid)) revs.filter(x => x.parent === id).forEach(x => b.delete(db.collection('po_reviews').doc(x.id)));
                await b.commit(); toast('Eliminado', 'ok')
            } catch (e) { toast('No se pudo eliminar', 'err') }
        }

        // Eventos
        document.addEventListener('click', async e => {
            const el = e.target.closest('[data-a]'); if (!el) return;
            const a = el.dataset.a, id = el.dataset.id;
            if (a === 'close') closeM();
            else if (a === 'login') loginM();
            else if (a === 'dologin') doLogin();
            else if (a === 'out') { await auth.signOut(); toast('Sesión cerrada') }
            else if (a === 'view') openPost(id, false);
            else if (a === 'rev') { if (!me) toast('Ingresá con tu cuenta de Pichisoft para dejar tu reseña', 'info'); else openPost(id, true) }
            else if (a === 'delp') { if (await ask('¿Eliminar esta publicación?')) db.collection('po_posts').doc(id).delete().then(() => toast('Eliminada', 'ok')).catch(() => toast('No se pudo', 'err')) }
            else if (a === 'pub') publish();
            else if (a === 'new') startCmp('new');
            else if (a === 'reply') startCmp('reply', revs.find(x => x.id == id));
            else if (a === 'edit') startCmp('edit', revs.find(x => x.id == id));
            else if (a === 'del') delRev(id);
            else if (a === 'like') like(id);
            else if (a === 'star') { cmp.text = $('#ct').value; cmp.stars = +el.dataset.s; drawCmp() }
            else if (a === 'cc') { cmp = null; $('#cmp').innerHTML = '' }
            else if (a === 'send') send();
        });
        $('#inf').onclick = infoM;
        $('#add').onclick = addM;
        drawTop();
    </script>
</body>

</html>
