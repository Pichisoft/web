<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PichonPass</title>

    <style>
        body {
            font-family: Arial;
            max-width: 850px;
            margin: 30px auto;
            transition: background .4s ease, color .4s ease;
        }

        input,
        textarea,
        button {
            width: 100%;
            padding: 8px;
            margin: 6px 0;
        }

        .card {
            border: 1px solid #ddd;
            padding: 12px;
            margin-top: 10px;
            border-radius: 6px;
            overflow-wrap: anywhere;
        }

        /* THEMES */
        .light {
            background: #fff;
            color: #111
        }

        .dark {
            background: #111;
            color: #eee
        }

        .dark input,
        .dark textarea {
            background: #222;
            color: #eee;
            border: 1px solid #444;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-family: "Times New Roman", Times, serif;
            font-size: 2.1rem;
            font-weight: bold;
            margin: 0;
        }

        .byline {
            font-family: "Segoe UI", Tahoma, sans-serif;
            font-size: 0.42em;
            font-style: italic;
            font-weight: normal;
            color: #777;
            vertical-align: middle;
            margin-left: 6px;
        }

        /* THEME BUTTON (ANIMADO) */
        #themeBtn {
            width: 48px;
            height: 48px;
            font-size: 22px;
            border-radius: 50%;
            border: 1px solid #aaa;
            background: transparent;

            display: flex;
            align-items: center;
            justify-content: center;

            transition: transform .3s ease;
        }

        #themeBtn:active {
            transform: scale(0.85) rotate(15deg);
        }

        /* PASSWORD BAR */
        .bar {
            height: 8px;
            background: #ddd;
            border-radius: 5px;
            overflow: hidden;
        }

        #fill {
            height: 100%;
            width: 0%;
            transition: .3s;
        }

        #txt {
            font-size: 12px;
            margin-top: 3px;
        }

        .credit {
            font-family: Verdana, sans-serif;
            font-size: 18px;
            font-style: italic;
            color: #bbb;
        }

        /* ==========================================
       PICHISOFT - ESTADO DE SESIÓN
       ========================================== */

        #pichisoft-session-status {
            position: fixed;
            top: 12px;
            right: 420px;
            z-index: 9999;

            display: flex;
            align-items: center;
            gap: 8px;

            max-width: calc(100vw - 20px);
            box-sizing: border-box;
            padding: 8px 16px;

            background: #000;
            color: #20a84b;

            border: 1px solid rgba(34, 197, 94, 0.25);
            border-radius: 22px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);

            font: 14px/1.3 Georgia, serif;
            text-align: left;

            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.6s ease, transform 0.6s ease;
            pointer-events: none;
        }

        #pichisoft-session-status.hidden {
            opacity: 0;
            transform: translateY(-12px);
        }

        #pichisoft-session-status.success {
            font-weight: bold;
        }

        #pichisoft-session-status .ps-check {
            display: none;
            font-size: 20px;
            font-weight: bold;
            line-height: 1;
        }

        #pichisoft-session-status.success .ps-check {
            display: inline-block;
            animation: pichisoftCheck 0.8s cubic-bezier(.17, .89, .32, 1.49) forwards;
        }

        @keyframes pichisoftCheck {
            0% {
                opacity: 0;
                transform: scale(0.2) rotate(-25deg);
            }

            60% {
                opacity: 1;
                transform: scale(1.25) rotate(8deg);
            }

            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        #pichisoft-session-profile {
            position: fixed;
            top: 12px;
            right: 420px;
            z-index: 9998;

            display: flex;
            align-items: center;
            gap: 8px;

            max-width: calc(100vw - 20px);
            box-sizing: border-box;
            padding: 5px 14px 5px 5px;

            background: #000;
            color: #fff;

            border: 1px solid rgba(34, 197, 94, 0.25);
            border-radius: 25px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);

            font-family: Georgia, serif;
            text-align: left;

            opacity: 0;
            transform: translateY(-12px) scale(0.9);
            transition: opacity 0.7s ease, transform 0.7s cubic-bezier(.17, .89, .32, 1.3);
            pointer-events: none;
        }

        #pichisoft-session-profile.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        #pichisoft-profile-picture img,
        #pichisoft-profile-picture .profile-placeholder {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #pichisoft-profile-picture .profile-placeholder {
            background: #20a84b;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
        }

        #pichisoft-profile-name {
            font-size: 14px;
            font-weight: bold;
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Celular: título más chico para que no choque con el link "Pichisoft" */
        @media (max-width: 600px) {
            .header {
                top: 16px;
                left: 15px;
            }

            .logo {
                font-size: 1.5rem;
            }

            .byline {
                font-size: 0.75rem;
            }

            #pichisoft-session-status,
            #pichisoft-session-profile {
                right: 10px;
            }

            #pichisoft-session-status {
                font-size: 13px;
                padding: 7px 14px;
            }
        }

        /* ===== Pichisoft - cartel de sesión en celular (PichonPass) ===== */
        @media (max-width: 600px) {
            body {
                margin: 30px auto 30px;
                padding-top: 58px;
                box-sizing: border-box;
            }

            #pichisoft-session-status,
            #pichisoft-session-profile {
                position: absolute;
                top: 8px;
                left: auto;
                right: 8px;
                width: max-content;
                max-width: calc(100vw - 16px);
                box-sizing: border-box;
            }

            #pichisoft-session-status {
                justify-content: center;
                text-align: center;
                font-size: 13px;
                padding: 7px 12px;
            }

            #pichisoft-session-profile {
                justify-content: flex-start;
            }
        }
    </style>

</head>

<body class="dark">


    <div class="topbar">
        <h1>
            PichonPass
            <span class="byline">- By Pichisoft -</span>
        </h1>
        <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
            <button id="themeBtn" onclick="toggleTheme()">🌙</button>
            <p style="font-weight: bold; margin: 0; font-size: 13px; text-align:right;"><a
                    href="https://pichisoft.github.io/web/" target="_blank"
                    style="color:#4db8ff; text-decoration: underline;">Pichisoft</a></p>
        </div>
    </div>

    <!-- LOGIN -->
    <div id="auth">

        <h3>Acceder</h3>

        <input id="username" placeholder="Nombre de usuario">
        <input id="password" type="password" placeholder="Contraseña">

        <button id="loginBtn" onclick="login()">Entrar</button>
        <button onclick="resetAll()">Restablecer datos</button>

        <div id="error" style="color:red;display:none">
            Usuario o contraseña incorrectos
        </div>

    </div>

    <!-- APP -->
    <div id="app" style="display:none">

        <h3>Nuevo registro</h3>

        <input id="title" placeholder="Título">
        <input id="user" placeholder="Usuario">

        <input id="pass" type="password" placeholder="Contraseña" oninput="checkStrength()">

        <button onclick="togglePass()">Mostrar / Ocultar</button>

        <div class="bar">
            <div id="fill"></div>
        </div>
        <div id="txt"></div>

        <input id="len" type="number" value="20">
        <button onclick="gen()">Generar contraseña</button>

        <textarea id="notes"></textarea>

        <button onclick="save()">Guardar</button>

        <div id="list"></div>

        <button onclick="logout()">Cerrar sesión</button>

    </div>

    <script>

        /* ============================================================
           Tus registros se guardan CIFRADOS (AES-GCM) con tu contraseña
           principal. Sin esa contraseña, lo guardado es texto ilegible
           (también en la nube, si tenés cuenta de Pichisoft).
           ============================================================ */
        let vault = [];
        let cryptoKey = null, cryptoSalt = null, masterUser = "";
        const BD = "pichonpass-classic-bd";
        const te = new TextEncoder(), td = new TextDecoder();

        const toHex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
        const fromHex = h => Uint8Array.from(h.match(/../g) || [], x => parseInt(x, 16));
        function toB64(buf) {
            const b = new Uint8Array(buf); let s = "";
            for (let i = 0; i < b.length; i += 8192) s += String.fromCharCode.apply(null, b.subarray(i, i + 8192));
            return btoa(s);
        }
        const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

        async function deriveKey(pass, salt) {
            const base = await crypto.subtle.importKey("raw", te.encode(pass), "PBKDF2", false, ["deriveKey"]);
            return crypto.subtle.deriveKey(
                { name: "PBKDF2", salt, iterations: 310000, hash: "SHA-256" },
                base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
        }

        async function persist() {
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, cryptoKey, te.encode(JSON.stringify(vault)));
            localStorage.setItem(BD, JSON.stringify({ u: masterUser, s: toHex(cryptoSalt), i: toHex(iv), c: toB64(ct) }));
        }

        function toggleTheme() {
            document.body.classList.toggle("dark");
            document.body.classList.toggle("light");
            let isDark = document.body.classList.contains("dark");

            themeBtn.textContent = isDark ? "🌙" : "☀️";
            document.body.style.transition = "background .3s ease, color .3s ease";

            // Guarda la elección del usuario ("dark" o "light")
            localStorage.setItem("pichonpass-theme", isDark ? "dark" : "light");
        }


        /* LOGIN */
        function getUsers() {
            try { return JSON.parse(localStorage.getItem("users") || "{}"); } catch (e) { return {}; }
        }
        window.PichisoftPremium = false;

        window.PichisoftSessionReady = new Promise(function (resolve) {
            window.setPichisoftPremium = function (hasPremium) {
                window.PichisoftPremium = !!hasPremium;
                resolve(window.PichisoftPremium);
            };
        });
        async function login() {
            const u = username.value.trim();
            const p = password.value;
            error.style.display = "none";

            if (!u || !p) { error.style.display = "block"; return; }

            let bd = null;
            try { bd = JSON.parse(localStorage.getItem(BD) || "null"); } catch (e) { }

            loginBtn.disabled = true;
            try {
                if (bd) {
                    // Ya hay una cuenta guardada: se prueba abrirla con la contraseña
                    if (bd.u !== u) throw new Error("bad");
                    const salt = fromHex(bd.s), key = await deriveKey(p, salt);
                    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromHex(bd.i) }, key, fromB64(bd.c));
                    vault = JSON.parse(td.decode(pt));
                    cryptoKey = key; cryptoSalt = salt; masterUser = u;
                } else {
                    // Primera vez (o cuenta vieja sin cifrar: se migra y se borra la contraseña en texto plano)
                    const old = getUsers();
                    if (Object.keys(old).length > 0 && old[u] !== p) throw new Error("bad");
                    cryptoSalt = crypto.getRandomValues(new Uint8Array(16));
                    cryptoKey = await deriveKey(p, cryptoSalt);
                    masterUser = u; vault = [];
                    await persist();
                    localStorage.removeItem("users");
                }
                password.value = "";
                enter();
                enter();

                if (window.PichisoftPremium === true) {
                    window.location.href = "index.html";
                    return;
                }
                render();
            } catch (e) {
                error.style.display = "block";
            }
            loginBtn.disabled = false;
        }

        /* ENTER */
        function enter() {
            auth.style.display = "none";
            app.style.display = "block";
        }

        function resetAll() {
            if (!confirm("¿Restablecer PichonPass? Se eliminarán únicamente los datos guardados de PichonPass en este dispositivo. Tu cuenta de Pichisoft no se verá afectada.")) {
                return;
            }

            // Datos propios de PichonPass
            localStorage.removeItem("users");       // Datos antiguos/migrados
            localStorage.removeItem("vault");       // Datos antiguos
            localStorage.removeItem(BD);            // Base cifrada actual
            localStorage.removeItem("pichonpass-theme");

            // NO tocar datos de la cuenta de Pichisoft.
            // Firebase mantiene la sesión y el perfil intactos.

            location.reload();
        }
        /* PASSWORD TOGGLE */
        function togglePass() {
            pass.type = pass.type === "password" ? "text" : "password";
        }

        /* SEGURIDAD DE LA CONTRASEÑA */
        function checkStrength() {
            let p = pass.value;
            let len = p.length;

            let fill = document.getElementById("fill");
            let txt = document.getElementById("txt");

            if (len <= 5) {
                fill.style.width = "33%";
                fill.style.background = "red";
                txt.textContent = "Contraseña fácil";
            }
            else if (len <= 8) {
                fill.style.width = "66%";
                fill.style.background = "orange";
                txt.textContent = "Contraseña intermedia";
            }
            else {
                fill.style.width = "100%";
                fill.style.background = "green";
                txt.textContent = "Contraseña difícil";
            }
        }

        /* GENERADOR */
        function gen() {
            let c = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+-=[]{}|;:,.<>/?~`¬¦¢£¥§±÷×";
            let n = parseInt(len.value) || 20;

            let r = new Uint32Array(n);
            crypto.getRandomValues(r);

            let out = "";
            for (let i = 0; i < n; i++) {
                out += c[r[i] % c.length];
            }

            pass.value = out;
            checkStrength();
        }

        /* VAULT */
        async function save() {
            vault.push({
                title: title.value,
                user: user.value,
                pass: pass.value,
                notes: notes.value
            });
            await persist();
            title.value = user.value = pass.value = notes.value = "";
            checkStrength();
            render();
        }

        function render() {
            list.innerHTML = "";
            vault.forEach((v, i) => {
                const d = document.createElement("div");
                d.className = "card";
                const b = document.createElement("b");
                b.textContent = v.title;
                d.appendChild(b);
                [v.user, v.pass, v.notes].forEach(t => {
                    d.appendChild(document.createElement("br"));
                    d.appendChild(document.createTextNode(t || ""));
                });
                const del = document.createElement("button");
                del.textContent = "Eliminar";
                del.onclick = async () => {
                    if (!confirm("¿Eliminar este registro?")) return;
                    vault.splice(i, 1);
                    await persist();
                    render();
                };
                d.appendChild(del);
                list.appendChild(d);
            });
        }

        /* LOGOUT */
        function logout() {
            location.reload();
        }

        function initTheme() {
            // Revisa si el usuario ya había elegido un tema antes
            let savedTheme = localStorage.getItem("pichonpass-theme");

            if (savedTheme === "light") {
                document.body.classList.remove("dark");
                document.body.classList.add("light");
            }
            else if (savedTheme === "dark") {
                document.body.classList.remove("light");
                document.body.classList.add("dark");
            }

            // Sincroniza el emoji del botón según el estado final del body
            let isDark = document.body.classList.contains("dark");
            themeBtn.textContent = isDark ? "🌙" : "☀️";
        }


        window.onload = initTheme;

    </script>
    <!-- ===== Pichisoft - Estado de sesión ===== -->
    <div id="pichisoft-session-status" role="status" aria-live="polite">
        <span class="ps-check">✓</span>
        <span class="ps-text">Iniciando sesión en tu cuenta de Pichisoft...</span>
    </div>

    <div id="pichisoft-session-profile">
        <div id="pichisoft-profile-picture"></div>
        <span id="pichisoft-profile-name"></span>
    </div>

    <script>
        (function () {
            /* Todo va dentro de esta función para no chocar con las variables de la app */
            var CFG = {
                apiKey: "AIzaSyCf_P8qp9nBUnsVe3qsTAtZJjZHOktKf-8",
                authDomain: "pichisoft.firebaseapp.com",
                projectId: "pichisoft",
                storageBucket: "pichisoft.firebasestorage.app",
                messagingSenderId: "690032082295",
                appId: "1:690032082295:web:b7f0e8cb8fcceb26e9b572",
                measurementId: "G-K7HRKR8BJ1"
            };
            var V = "https://www.gstatic.com/firebasejs/12.3.0/";
            var DUR_INICIO = 12000;   // "Iniciando sesión..."
            var DUR_MENSAJE = 6000;   // "Sesión iniciada" / avisos

            var box = document.getElementById("pichisoft-session-status");
            var txt = box.querySelector(".ps-text");
            var prof = document.getElementById("pichisoft-session-profile");
            var pic = document.getElementById("pichisoft-profile-picture");
            var nameEl = document.getElementById("pichisoft-profile-name");
            var t0 = Date.now();

            /* El cartel se ubica justo debajo de la cabecera (sea cual sea su alto) */
            function pos() {
                var h = document.querySelector(".topbar");
                var t = (h ? h.offsetHeight : 60) + 8;

                if (window.innerWidth <= 600) {
                    t = 8;
                }

                box.style.top = t + "px";
                prof.style.top = t + "px";
            }

            pos();
            window.addEventListener("resize", pos);

            function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

            /* Espera a que Firebase confirme si hay sesión y lee el perfil.
               Si algo falla (sin internet, permisos, etc.) devuelve {error:true} en vez de quedarse trabado. */
            async function comprobar() {
                try {
                    var m = await Promise.all([
                        import(V + "firebase-app.js"),
                        import(V + "firebase-auth.js"),
                        import(V + "firebase-firestore.js")
                    ]);
                    var app = m[0].initializeApp(CFG);
                    var auth = m[1].getAuth(app);
                    var db = m[2].getFirestore(app);

                    var user = await Promise.race([
                        new Promise(function (res) {
                            m[1].onAuthStateChanged(auth, function (u) {
                                window.PichisoftFirebase = { auth: auth, db: db, currentUser: u };
                                res(u);
                            });
                        }),
                        wait(15000).then(function () { throw new Error("tiempo agotado"); })
                    ]);

                    var perfil = {};
                    if (user) {
                        try {
                            var snap = await m[2].getDoc(m[2].doc(db, "users", user.uid));
                            if (snap.exists()) perfil = snap.data();
                        } catch (e) {
                            console.error("Pichisoft: no se pudo leer el perfil", e);
                        }
                    }
                    return { user: user, perfil: perfil };
                } catch (e) {
                    console.error("Pichisoft:", e);
                    return { error: true };
                }
            }

            async function aviso(texto) {
                txt.textContent = texto;
                await wait(DUR_MENSAJE);
                box.classList.add("hidden");
            }

            (async function () {
                var r = await comprobar();
                await wait(Math.max(0, DUR_INICIO - (Date.now() - t0)));

                if (r.error) return aviso("No se pudo comprobar tu sesión de Pichisoft");
                if (!r.user) return aviso("No tenés una sesión iniciada en Pichisoft");

                window.location.href = "pichonpass.html";
                return;
                txt.textContent = "Sesión iniciada";
                await wait(DUR_MENSAJE);
                box.classList.add("hidden");

                var nombre = r.perfil.username || "Usuario";
                nameEl.textContent = nombre;
                var foto = r.perfil.photo;
                if (typeof foto === "string" && /^(data:image\/|https:\/\/)/.test(foto)) {
                    var img = new Image();
                    img.src = foto;
                    img.alt = "Foto de perfil";
                    pic.replaceChildren(img);
                } else {
                    var ph = document.createElement("div");
                    ph.className = "profile-placeholder";
                    ph.textContent = nombre.charAt(0).toUpperCase();
                    pic.replaceChildren(ph);
                }
                await wait(450);
                prof.classList.add("visible");
            })();
        })();
    </script>
    <script src="pichisoft-datos.js?v=2" data-keys="pichonpass-bd"></script>
</body>

</html>
