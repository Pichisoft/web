<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <title>PichonPaint</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent
        }

        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #d9d6cf;
            overscroll-behavior: none;
            font-family: Georgia, serif;
            -webkit-user-select: none;
            user-select: none
        }

        #stage {
            position: fixed;
            inset: 0;
            overflow: hidden;
            touch-action: none;
            cursor: crosshair
        }

        #board {
            position: absolute;
            transform-origin: 0 0;
            background: #fff;
            box-shadow: 0 0 0 1px rgba(0, 0, 0, .15), 0 10px 40px rgba(0, 0, 0, .2)
        }

        #board canvas {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%
        }

        #pv {
            pointer-events: none
        }

        #stage.t-text {
            cursor: text
        }

        #stage.t-hand,
        #stage.pan {
            cursor: grab
        }

        #stage.t-picker,
        #stage.t-fill {
            cursor: copy
        }

        .header {
            position: fixed;
            top: 20px;
            left: 24px;
            z-index: 20;
            pointer-events: none;
            display: flex;
            align-items: baseline;
            gap: 4px;
            background: rgba(255, 255, 255, .82);
            padding: 2px 10px;
            border-radius: 8px
        }

        .logo {
            font-family: "Times New Roman", Times, serif;
            font-weight: bold;
            color: #000;
            font-size: 2rem
        }

        .byline {
            font-family: "Times New Roman", Times, serif;
            font-style: italic;
            color: #888;
            font-size: .95rem
        }

        /* ===== Dock vertical izquierdo ===== */
        #dock {
            position: fixed;
            left: 10px;
            top: 76px;
            bottom: 10px;
            z-index: 30;
            width: 52px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 5px;
            overflow-y: auto;
            scrollbar-width: none;
            background: #0a0a0a;
            color: #fff;
            border: 1px solid rgba(34, 197, 94, .3);
            border-radius: 26px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .35), inset 0 0 20px rgba(34, 197, 94, .05)
        }

        #dock::-webkit-scrollbar {
            display: none
        }

        #dock .b,
        #panel .b {
            flex: none;
            width: 40px;
            height: 40px;
            padding: 0;
            border-radius: 14px;
            border: 1px solid transparent;
            background: transparent;
            color: #d4d4d4;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s, color .15s, transform .15s
        }

        #dock .b:hover:not(:disabled) {
            background: #1f1f1f;
            color: #fff
        }

        #dock .b:disabled {
            opacity: .3;
            cursor: default
        }

        #dock .b.on {
            background: #20a84b;
            color: #fff;
            box-shadow: 0 0 14px rgba(32, 168, 75, .55);
            transform: scale(1.05)
        }

        #dock .b.go {
            background: #20a84b;
            color: #fff
        }

        #dock .b.go:disabled {
            background: #1c1c1c
        }

        svg {
            width: 22px;
            height: 22px;
            display: block
        }

        .sep {
            flex: none;
            width: 26px;
            height: 1px;
            background: #2a2a2a;
            margin: 3px 0
        }

        #zl {
            font: 11px Georgia, serif;
            color: #9ca3af;
            flex: none
        }

        /* ===== Paleta flotante (abajo a la derecha) ===== */
        #palb {
            position: fixed;
            right: 14px;
            bottom: calc(14px + env(safe-area-inset-bottom, 0px));
            z-index: 35;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 3px solid #000;
            background: #000;
            padding: 0;
            cursor: pointer;
            box-shadow: 0 6px 22px rgba(0, 0, 0, .4), 0 0 0 2px rgba(34, 197, 94, .5);
            overflow: hidden;
            display: block
        }

        #palb i {
            position: absolute;
            inset: 0;
            display: block
        }

        #palb i.c2 {
            clip-path: polygon(100% 0, 100% 100%, 0 100%)
        }

        #panel {
            position: fixed;
            right: 14px;
            bottom: calc(80px + env(safe-area-inset-bottom, 0px));
            z-index: 34;
            width: 310px;
            max-width: calc(100vw - 80px);
            max-height: calc(100vh - 170px);
            overflow: auto;
            background: #0a0a0a;
            color: #fff;
            border: 1px solid rgba(34, 197, 94, .3);
            border-radius: 20px;
            padding: 12px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, .45);
            display: none;
            flex-direction: column;
            gap: 10px
        }

        #panel.open {
            display: flex
        }

        #panel h4 {
            margin: 0;
            font: bold 12px Georgia, serif;
            color: #20a84b;
            letter-spacing: .08em;
            text-transform: uppercase
        }

        #sws {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 5px
        }

        .sw {
            aspect-ratio: 1;
            border-radius: 50%;
            border: 2px solid #333;
            padding: 0;
            cursor: pointer;
            min-width: 0
        }

        .sw.on {
            border-color: #fff;
            transform: scale(1.18)
        }

        .sw.on2 {
            box-shadow: 0 0 0 2px #20a84b
        }

        .prow {
            display: flex;
            align-items: center;
            gap: 8px
        }

        #color,
        #color2 {
            width: 38px;
            height: 34px;
            padding: 0;
            border: 0;
            background: none;
            cursor: pointer
        }

        #panel .b {
            width: 38px;
            height: 34px;
            border-radius: 10px;
            background: #1c1c1c;
            border-color: #333
        }

        #panel .b.on {
            background: #20a84b
        }

        #size {
            flex: 1;
            accent-color: #20a84b
        }

        #sv {
            min-width: 30px;
            text-align: right;
            font-size: 13px
        }

        #dot {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: none
        }

        #dot i {
            display: block;
            border-radius: 50%;
            background: #fff;
            max-width: 44px;
            max-height: 44px
        }

        #panel select,
        #fillb {
            font: 14px Georgia, serif;
            color: #fff;
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 6px 10px;
            cursor: pointer;
            min-height: 34px
        }

        #fillb.on {
            background: #20a84b;
            border-color: #20a84b
        }

        #panel select {
            flex: 1
        }

        #files {
            position: fixed;
            left: 72px;
            bottom: calc(14px + env(safe-area-inset-bottom, 0px));
            z-index: 30;
            height: 56px;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0 8px;
            background: #0a0a0a;
            border: 1px solid rgba(34, 197, 94, .3);
            border-radius: 28px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .35)
        }

        #files .b {
            flex: none;
            width: 40px;
            height: 40px;
            padding: 0;
            border-radius: 14px;
            border: 1px solid transparent;
            background: transparent;
            color: #d4d4d4;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s, color .15s
        }

        #files .b:hover:not(:disabled) {
            background: #1f1f1f;
            color: #fff
        }

        #files .b:disabled {
            opacity: .3;
            cursor: default
        }

        #files .b.go {
            width: auto;
            padding: 0 14px;
            gap: 6px;
            background: #20a84b;
            color: #fff;
            font: bold 14px Georgia, serif
        }

        #files .b.go:disabled {
            background: #1c1c1c
        }

        .modal-box.gm {
            max-width: 680px;
            max-height: calc(100vh - 40px);
            display: flex;
            flex-direction: column
        }

        .gm .top {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px
        }

        .gm .top button,
        .gc button {
            padding: 7px 12px;
            border-radius: 8px;
            border: none;
            font: 13px Georgia, serif;
            cursor: pointer;
            color: #fff;
            background: #333
        }

        .gm .top .confirm,
        .gc button:first-child {
            background: #20a84b;
            font-weight: bold
        }

        #glist {
            overflow: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            color: #9ca3af
        }

        .gc {
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            color: #fff;
            min-width: 0
        }

        .gc.cur {
            border-color: #20a84b
        }

        .gc img {
            width: 100%;
            aspect-ratio: 16/10;
            object-fit: cover;
            border-radius: 8px;
            background: #fff
        }

        .gc b {
            font-size: 13px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .gc small {
            color: #9ca3af
        }

        .gc .r {
            display: flex;
            gap: 4px;
            flex-wrap: wrap
        }

        .gc button {
            padding: 5px 8px;
            font-size: 12px
        }

        .dlg-ov {
            position: fixed;
            inset: 0;
            z-index: 1100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, .6);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px)
        }

        .dlg-ov.open {
            display: flex;
            animation: dfade .2s ease
        }

        .dlg-ov.danger {
            --ac: #e11d48;
            --gl: rgba(225, 29, 72, .28)
        }

        .dlg-card {
            --ac: #20a84b;
            --gl: rgba(32, 168, 75, .28);
            width: 100%;
            max-width: 360px;
            padding: 0 20px 18px;
            background: #0a0a0a;
            color: #fff;
            border: 1px solid var(--ac);
            border-radius: 20px;
            overflow: hidden;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .6), 0 0 34px var(--gl);
            animation: dpop .45s cubic-bezier(.2, 1.2, .3, 1)
        }

        .dlg-ov.danger .dlg-card {
            --ac: #e11d48;
            --gl: rgba(225, 29, 72, .28)
        }

        .dlg-card::before {
            content: "";
            display: block;
            height: 10px;
            margin: 0 -20px;
            background: repeating-linear-gradient(-45deg, var(--ac) 0 10px, #0a0a0a 10px 20px)
        }

        .dlg-ico {
            width: 54px;
            height: 54px;
            margin: 18px auto 10px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--ac);
            color: #fff;
            box-shadow: 0 0 0 6px var(--gl);
            animation: dwob .6s .15s ease both
        }

        .dlg-ico svg {
            width: 26px;
            height: 26px
        }

        .dlg-card h3 {
            margin: 0 0 6px;
            font: bold 1.3rem "Times New Roman", Times, serif
        }

        .dlg-card p {
            margin: 0 0 4px;
            font: 14px/1.5 Georgia, serif;
            color: #d1d5db;
            word-break: break-word
        }

        #dlg-i {
            width: 100%;
            margin: 8px 0 2px;
            padding: 10px 12px;
            background: #000;
            color: #fff;
            border: 1px solid var(--ac);
            border-radius: 10px;
            font: 16px Georgia, serif;
            outline: none;
            -webkit-user-select: text;
            user-select: text
        }

        .dlg-act {
            display: flex;
            gap: 10px;
            margin-top: 16px
        }

        .dlg-act button {
            flex: 1;
            padding: 11px 10px;
            border-radius: 12px;
            font: bold 14px Georgia, serif;
            color: #fff;
            cursor: pointer;
            transition: transform .15s, filter .15s
        }

        .dlg-act button:hover {
            transform: translateY(-2px);
            filter: brightness(1.15)
        }

        #dlg-ok {
            background: var(--ac);
            border: 1px solid var(--ac)
        }

        #dlg-no {
            background: #1c1c1c;
            border: 1px solid #333
        }

        .dlg-act button:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 2px
        }

        @keyframes dfade {
            from {
                opacity: 0
            }

            to {
                opacity: 1
            }
        }

        @keyframes dpop {
            from {
                opacity: 0;
                transform: translateY(24px) scale(.86) rotate(-1.5deg)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        @keyframes dwob {
            0% {
                transform: scale(.4) rotate(-30deg)
            }

            60% {
                transform: scale(1.15) rotate(8deg)
            }

            100% {
                transform: none
            }
        }

        @media(prefers-reduced-motion:reduce) {

            .dlg-ov.open,
            .dlg-card,
            .dlg-ico {
                animation: none
            }
        }

        #toast {
            position: fixed;
            left: 50%;
            transform: translate(-50%, -8px);
            top: 84px;
            z-index: 40;
            background: #000;
            color: #fff;
            padding: 8px 16px;
            border-radius: 18px;
            font-size: 14px;
            opacity: 0;
            transition: opacity .4s, transform .4s;
            pointer-events: none;
            max-width: calc(100vw - 20px);
            text-align: center
        }

        #toast.show {
            opacity: 1;
            transform: translate(-50%, 0)
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px
        }

        .modal-overlay.open {
            display: flex
        }

        .modal-box {
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 14px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            color: #fff
        }

        .modal-box h3 {
            margin-top: 0;
            font-family: "Times New Roman", serif
        }

        .modal-box textarea {
            width: 100%;
            min-height: 100px;
            background: #000;
            color: #fff;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            font-family: inherit;
            font-size: 16px;
            resize: vertical;
            -webkit-user-select: text;
            user-select: text
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 15px
        }

        .modal-actions button {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            font: inherit;
            cursor: pointer
        }

        .cancel {
            background: #555;
            color: #fff
        }

        .confirm {
            background: #20a84b;
            color: #fff;
            font-weight: bold
        }

        /* Pichisoft sesión */
        #pichisoft-session-status {
            position: fixed;
            top: 52px;
            right: 20px;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: calc(100vw - 20px);
            padding: 8px 16px;
            background: #000;
            color: #20a84b;
            border: 1px solid rgba(34, 197, 94, .25);
            border-radius: 22px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .25);
            font: 14px/1.3 Georgia, serif;
            opacity: 1;
            transform: translateY(0);
            transition: opacity .6s, transform .6s;
            pointer-events: none
        }

        #pichisoft-session-status.hidden {
            opacity: 0;
            transform: translateY(-12px)
        }

        #pichisoft-session-status.success {
            font-weight: bold
        }

        #pichisoft-session-status .ps-check {
            display: none;
            font-size: 20px;
            font-weight: bold;
            line-height: 1
        }

        #pichisoft-session-status.success .ps-check {
            display: inline-block;
            animation: pck .8s cubic-bezier(.17, .89, .32, 1.49) forwards
        }

        @keyframes pck {
            0% {
                opacity: 0;
                transform: scale(.2) rotate(-25deg)
            }

            60% {
                opacity: 1;
                transform: scale(1.25) rotate(8deg)
            }

            100% {
                opacity: 1;
                transform: none
            }
        }

        #pichisoft-session-profile {
            position: fixed;
            top: 52px;
            right: 20px;
            z-index: 9998;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: calc(100vw - 20px);
            padding: 5px 14px 5px 5px;
            background: #000;
            color: #fff;
            border: 1px solid rgba(34, 197, 94, .25);
            border-radius: 25px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .25);
            opacity: 0;
            transform: translateY(-12px) scale(.9);
            transition: opacity .7s, transform .7s cubic-bezier(.17, .89, .32, 1.3);
            pointer-events: none
        }

        #pichisoft-session-profile.visible {
            opacity: 1;
            transform: none
        }

        #pichisoft-profile-picture img,
        #pichisoft-profile-picture .profile-placeholder {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center
        }

        #pichisoft-profile-picture .profile-placeholder {
            background: #20a84b;
            color: #fff;
            font-size: 15px;
            font-weight: bold
        }

        #pichisoft-profile-name {
            font-size: 14px;
            font-weight: bold;
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        @media(max-width:600px) {
            #files .lbl {
                display: none
            }

            #files .b.go {
                width: 40px;
                padding: 0
            }

            .header {
                top: 14px;
                left: 10px
            }

            .logo {
                font-size: 1.4rem
            }

            .byline {
                font-size: .7rem
            }

            #dock {
                top: 64px;
                width: 48px
            }

            #dock .b {
                width: 38px;
                height: 38px
            }

            #pichisoft-session-status,
            #pichisoft-session-profile {
                right: 10px
            }

            #pichisoft-session-status {
                font-size: 13px;
                padding: 7px 14px
            }
        }
    </style>
</head>

<body>
    <div class="header"><span class="logo">PichonPaint</span><span class="byline"> - By Pichisoft - </span></div>

    <div id="stage">
        <div id="board"><canvas id="cv" aria-label="Lienzo"></canvas><canvas id="pv"></canvas></div>
    </div>

    <nav id="dock" aria-label="Herramientas">
        <div id="tools" style="display:contents"></div>
        <span class="sep"></span>
        <button class="b" id="undo" data-i="undo" title="Deshacer (Ctrl+Z)" disabled></button>
        <button class="b" id="redo" data-i="redo" title="Rehacer (Ctrl+Y)" disabled></button>
        <span class="sep"></span>
        <button class="b" id="zi" data-i="plus" title="Acercar (+)"></button>
        <span id="zl">100%</span>
        <button class="b" id="zo" data-i="minus" title="Alejar (-)"></button>
        <button class="b" id="zf" data-i="fit" title="Ajustar a pantalla (0)"></button>
        <span class="sep"></span>
        <button class="b" id="new" data-i="trash" title="Lienzo nuevo"></button>
    </nav>

    <div id="files" role="toolbar" aria-label="Archivo">
        <button class="b" id="imp" data-i="upload" title="Importar una imagen"></button>
        <button class="b" id="dl" data-i="download" title="Descargar imagen (PNG)"></button>
        <button class="b" id="gal" data-i="folder" title="Mis dibujos"></button>
        <button class="b go" id="save" data-i="save" title="Guardar (Ctrl+S)" disabled><span
                class="lbl">Guardar</span></button>
    </div>
    <input type="file" id="file" accept="image/*" hidden>
    <button id="palb" aria-label="Colores y ajustes" title="Colores y ajustes"><i class="c1"></i><i
            class="c2"></i></button>
    <div id="panel">
        <h4>Colores</h4>
        <div id="sws"></div>
        <div class="prow">
            <input type="color" id="color" value="#e11d48" title="Color principal (clic izq.)"
                aria-label="Color principal">
            <button class="b" id="swap" data-i="swap" title="Intercambiar (X)"></button>
            <input type="color" id="color2" value="#ffffff" title="Color secundario (clic der.)"
                aria-label="Color secundario">
            <span style="font-size:12px;color:#9ca3af">Der. = secundario</span>
        </div>
        <h4>Trazo</h4>
        <div class="prow">
            <div id="dot"><i></i></div><input type="range" id="size" min="1" max="80" value="8"
                aria-label="Grosor"><span id="sv">8</span>
        </div>
        <div class="prow"><button id="fillb">Contorno</button>
            <select id="font" aria-label="Tipografía">
                <option value="Arial, sans-serif">Sans</option>
                <option value="Georgia, serif">Serif</option>
                <option value="'Courier New', monospace">Mono</option>
                <option value="'Comic Sans MS', cursive">Cómic</option>
                <option value="Impact, sans-serif">Impact</option>
            </select>
        </div>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>

    <div class="dlg-ov" id="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t">
        <div class="dlg-card">
            <div class="dlg-ico" id="dlg-ico"></div>

        $("new").onclick = async () => { if (dirty && !await ask("¿Empezar un lienzo nuevo?", "Tenés cambios sin guardar y se van a perder.", { ok: "Empezar de nuevo", danger: true })) return; base = null; strokes = []; redo = []; dirty = false; curId = null; curName = ""; redraw(); sync() };
        $("dl").onclick = () => cv.toBlob(blob => { const u = URL.createObjectURL(blob), a = document.createElement("a"); a.href = u; a.download = (curName || "pichonpaint").replace(/[^\w\- áéíóúñÁÉÍÓÚÑ]/g, "").trim().replace(/\s+/g, "-") + "-" + new Date().toISOString().slice(0, 10) + ".png"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); toast("✓ Imagen descargada") }, "image/png");
        addEventListener("keydown", e => {
            if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) && !(e.ctrlKey || e.metaKey)) return;
            if (e.key === "Escape") closeGal();
            if (document.querySelector(".modal-overlay.open") && !(e.ctrlKey || e.metaKey)) return;
            const k = e.key.toLowerCase();
            if (e.ctrlKey || e.metaKey) { if (k === "z") { e.preventDefault(); e.shiftKey ? redoFn() : undo() } else if (k === "y") { e.preventDefault(); redoFn() } else if (k === "s") { e.preventDefault(); save() } }
            else if (e.code === "Space") { e.preventDefault(); space = true; stage.classList.add("pan") }
            else {
                const m = { b: "brush", e: "eraser", l: "line", r: "rect", o: "ellipse", f: "fill", t: "text", i: "picker", h: "hand" };
                if (m[k]) setTool(m[k]); else if (k === "+" || k === "=") zoomBtn(1.25); else if (k === "-") zoomBtn(.8); else if (k === "0") resetView(); else if (k === "x") $("swap").click();
                else if (k === "[") { $("size").value = Math.max(1, size() - 3); dot() } else if (k === "]") { $("size").value = Math.min(80, size() + 3); dot() }

        });
        addEventListener("keyup", e => { if (e.code === "Space") { space = false; stage.classList.remove("pan") } });
        let tt; function toast(msg, ms = 3000) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), ms) }

        /* ---- Guardado personal (cada usuario su dibujo) ---- */
        const loadImg = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src });
        const LSK = () => "pichonpaint:dibujos:" + (uid || "local");
        const rdLocal = () => { try { return JSON.parse(localStorage.getItem(LSK()) || "[]") } catch (e) { return [] } };
        const wrLocal = a => { try { localStorage.setItem(LSK(), JSON.stringify(a)); return true } catch (e) { return false } };
        function encode(c) { for (let q = .92; q > .25; q -= .1) { const d = c.toDataURL("image/jpeg", q); if (d.length < 1000000) return d } return c.toDataURL("image/jpeg", .25) }
        function thumbOf(c) { const t = document.createElement("canvas"); t.width = 320; t.height = 200; t.getContext("2d").drawImage(c, 0, 0, 320, 200); return t.toDataURL("image/jpeg", .7) }
        const fmt = t => t ? new Date(t).toLocaleString("es-AR", { day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";
        let galOpen = false;

        async function listAll() {
            const out = [];
            if (db && uid) {
                try { (await getDocs(collection(db, "pichonpaint", uid, "dibujos"))).forEach(d => out.push({ ...d.data(), id: d.id, src: "cloud" })) } catch (e) { console.error(e) }
                try { const s = await getDoc(doc(db, "pichonpaint", uid)), d = s.exists() && s.data(); if (d && d.data) out.push({ id: "__old", src: "old", name: "Dibujo anterior", data: d.data, thumb: d.data, t: d.updatedAt && d.updatedAt.toMillis ? d.updatedAt.toMillis() : 0 }) } catch (e) { }
            }
            rdLocal().forEach(d => out.push({ ...d, src: "local" }));
            try { const o = localStorage.getItem("pichonpaint:" + (uid || "local")); if (o) out.push({ id: "__oldl", src: "oldl", name: "Dibujo anterior (dispositivo)", data: o, thumb: o, t: 0 }) } catch (e) { }
            return out.sort((a, b) => (b.t || 0) - (a.t || 0));
        }

        async function save(copy) {
            if (saving) return;
            if (!dirty && copy !== true) { toast("No hay cambios para guardar"); return }
            saving = true; sync(); toast("Guardando...", 8000);
            const tmp = document.createElement("canvas"); tmp.width = W; tmp.height = H;
            paint(tmp.getContext("2d", { willReadFrequently: true }), base, strokes);
            const data = encode(tmp), thumb = thumbOf(tmp), nuevo = copy === true || !curId;
            const id = nuevo ? "d" + Date.now().toString(36) : curId;
            const name = nuevo ? (copy === true && curName ? curName + " (copia)" : (curName || "Dibujo " + fmt(Date.now()))) : curName;
            const item = { name, data, thumb, t: Date.now() }; let src = null;
            if (db && uid && (nuevo || curSrc !== "local")) { try { await setDoc(doc(db, "pichonpaint", uid, "dibujos", id), item); src = "cloud" } catch (e) { console.error(e) } }
            if (!src) { const a = rdLocal().filter(d => d.id !== id); a.push({ ...item, id }); if (wrLocal(a)) src = "local" }
            if (src) { curId = id; curName = name; curSrc = src; base = tmp; strokes = []; redo = []; dirty = false; redraw(); toast(src === "cloud" ? "✓ Guardado en tu cuenta: " + name : "✓ Guardado en este dispositivo: " + name) }
            else toast("No se pudo guardar (sin espacio). Descargá la imagen para no perderla.", 5000);

        $("save").onclick = () => save();
        addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = "" } });

        /* ---- Carteles propios (reemplazan confirm/prompt) ---- */
        function dlgOpen(o) {
            return new Promise(res => {
                const d = $("dlg"), inp = $("dlg-i"), txt = o.input != null;
                d.classList.toggle("danger", !!o.danger);
                $("dlg-ico").innerHTML = ic(txt ? "brush" : o.danger ? "trash" : "warn");
                $("dlg-t").textContent = o.title; $("dlg-m").textContent = o.msg || ""; $("dlg-m").style.display = o.msg ? "" : "none";
                inp.style.display = txt ? "" : "none"; inp.value = txt ? o.input : "";
                $("dlg-ok").textContent = o.ok || "Aceptar"; $("dlg-no").textContent = o.no || "Cancelar";
                const no = () => done(txt ? null : false), yes = () => done(txt ? inp.value : true);
                const kd = e => {
                    const inI = e.target === inp;
                    if (e.key === "Escape") { e.preventDefault(); e.stopImmediatePropagation(); no(); return }
                    if (e.key === "Enter" && inI) { e.preventDefault(); e.stopImmediatePropagation(); yes(); return }
                    if (e.key !== "Tab" && e.key !== "Enter" && !(inI && !e.ctrlKey && !e.metaKey)) e.stopImmediatePropagation();
                };
                function done(v) { d.classList.remove("open"); removeEventListener("keydown", kd, true); $("dlg-ok").onclick = $("dlg-no").onclick = d.onclick = null; res(v) }
                $("dlg-ok").onclick = yes; $("dlg-no").onclick = no; d.onclick = e => { if (e.target === d) no() };
                addEventListener("keydown", kd, true); d.classList.add("open");
                setTimeout(() => { if (txt) { inp.focus(); inp.select() } else (o.danger ? $("dlg-no") : $("dlg-ok")).focus() }, 60);
            });
        }
        const ask = (title, msg, o = {}) => dlgOpen({ title, msg, ...o });
        const askText = (title, val) => dlgOpen({ title, input: val, ok: "Guardar" });

        /* ---- Mis dibujos ---- */
        function closeGal() { galOpen = false; $("modal-gal").classList.remove("open") }
        async function openGal() { galOpen = true; $("modal-gal").classList.add("open"); await renderGal() }
        async function renderGal() {
            const L = $("glist"); L.textContent = "Cargando...";
            const items = await listAll(); L.textContent = "";
            if (!items.length) { L.textContent = "Todavía no guardaste dibujos."; return }
            items.forEach(it => {
                const c = document.createElement("div"); c.className = "gc" + (it.id === curId ? " cur" : "");
                const im = new Image(); im.src = it.thumb || it.data; im.alt = it.name || "";
                const n = document.createElement("b"); n.textContent = it.name || "Sin nombre";
                const sm = document.createElement("small"); sm.textContent = fmt(it.t) + (it.src === "local" || it.src === "oldl" ? " · dispositivo" : "");
                const r = document.createElement("div"); r.className = "r";
                [["Abrir", () => openItem(it)], ["Nombre", () => rename(it)], ["Borrar", () => del(it)]].forEach(([t, f]) => { const b = document.createElement("button"); b.textContent = t; b.onclick = f; r.appendChild(b) });
                c.append(im, n, sm, r); L.appendChild(c);
            });
        }
        async function openItem(it) {
            if (dirty && !await ask("¿Abrir otro dibujo?", "Tenés cambios sin guardar y se van a perder.", { ok: "Abrir igual", danger: true })) return;

        }
        async function del(it) {
            if (!await ask("¿Borrar este dibujo?", '"' + (it.name || "Sin nombre") + '" se va a borrar para siempre.', { ok: "Borrar", danger: true })) return;
            try {
                if (it.src === "cloud") await deleteDoc(doc(db, "pichonpaint", uid, "dibujos", it.id));
                else if (it.src === "old") await deleteDoc(doc(db, "pichonpaint", uid));

                else wrLocal(rdLocal().filter(d => d.id !== it.id));
                if (it.id === curId) { curId = null; curName = "" }
            } catch (e) { console.error(e); toast("No se pudo borrar", 3000) }
            renderGal();
        }
        async function openLatest() { const L = await listAll(); if (L.length && !dirty && !strokes.length) await openItem(L[0]) }
        $("gal").onclick = openGal; $("g-close").onclick = closeGal;
        $("modal-gal").onclick = e => { if (e.target === e.currentTarget) closeGal() };
        $("g-save").onclick = () => save(); $("g-copy").onclick = () => save(true); $("g-dl").onclick = () => $("dl").click();

        /* ---- Importar imagen ---- */
        $("imp").onclick = () => $("file").click();
        $("g-imp").onclick = () => { closeGal(); $("file").click() };
        $("file").onchange = e => {
            const f = e.target.files[0]; e.target.value = ""; if (!f) return;

            img.onerror = () => { URL.revokeObjectURL(u); toast("No se pudo leer la imagen", 3000) };

        };

        setTool("brush"); pickColor(color, true); pickColor(color2, true, true); fit(); redraw(); sync();
        db = await new Promise(res => { let n = 0; const i = setInterval(() => { if (window.PichisoftFirebase && window.PichisoftFirebase.db) { clearInterval(i); res(window.PichisoftFirebase.db) } else if (++n > 250) { clearInterval(i); res(null) } }, 100) });
        uid = window.PichisoftFirebase && window.PichisoftFirebase.currentUser ? window.PichisoftFirebase.currentUser.uid : null;
        await openLatest();

    </script>

    <script>
        (function () {
            'use strict';
            const CONFIG = {

                descripcion: `PichonPaint sirve para pintar y dibujar: pincel, goma, formas, texto, balde, gotero y más. Tu dibujo es solo tuyo: se guarda en tu cuenta de Pichisoft (o en este dispositivo si no iniciaste sesión).

<strong>Atajos:</strong> B pincel · E goma · L línea · R rectángulo · O elipse · F balde · T texto · I gotero · H mano · [ ] grosor · Shift = líneas rectas y formas perfectas · clic derecho = color secundario.

Podés sugerir mejoras <a href="https://mail.google.com/mail/?view=cm&fs=1&to=contacto@pichisoft.cc" target="_blank" rel="noopener">aquí</a>.`,

            document.head.appendChild(css);
            const btn = document.createElement('button'); btn.id = 'psHelpBtn'; btn.type = 'button'; btn.setAttribute('aria-label', 'Ayuda'); btn.title = 'Ayuda'; btn.textContent = '?'; document.body.appendChild(btn);

                ov.querySelector('#psHelpTitle').textContent = CONFIG.titulo; ov.querySelector('#psHelpBody').innerHTML = CONFIG.descripcion;
